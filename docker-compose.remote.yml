# Override for a portal that drives a **remote** Incus cluster, or none at all.
#
#   docker compose -f docker-compose.yml -f docker-compose.remote.yml up -d
#   make up-remote
#
# The base stack is the single-host lab: `lab-setup` installs and initialises
# Incus on the host and the portal reads /var/lib/incus. Where that is not what
# you want — the control plane on a laptop with the machines on a cluster, or
# demo mode with no hypervisor anywhere — this turns the host step off and lets
# the portal talk to a named remote instead.
#
# The Incus CLI's trust configuration is per-operator (its own certificates),
# so it has to be mounted by you; docs/docker.md § "A remote Incus cluster"
# shows the mounts. Set ONTRAK_INCUS__REMOTE in .env to the remote's name.
#
# Demo mode needs neither: ONTRAK_DEMO__ENABLED=true in .env, no cluster, no
# machines, the whole class simulated in memory.

services:
  lab-setup:
    environment:
      # No host hypervisor to prepare: the point of this file.
      ONTRAK_LAB_SETUP: "off"
      ONTRAK_INCUS__REMOTE: ${ONTRAK_INCUS__REMOTE:-ontrak-remote}

  portal:
    environment:
      ONTRAK_INCUS__REMOTE: ${ONTRAK_INCUS__REMOTE:-ontrak-remote}
    volumes:
      # The CLI's trust config, mounted read-only. Uncomment and adjust for your
      # operator account, or point ONTRAK_INCUS__REMOTE at a configured remote
      # that the image already knows:
      #   - ${HOME}/.config/incus:/root/.config/incus:ro
      #   - /etc/incus/client.crt:/etc/incus/client.crt:ro
      #   - /etc/incus/client.key:/etc/incus/client.key:ro
      - /var/lib/incus:/var/lib/incus
