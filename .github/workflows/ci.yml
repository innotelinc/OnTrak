# ═══════════════════════════════════════════════════════════════════════════
# ci.yml — the checks that must be green on main.
#
# Nine concerns, in the order they fail cheapest:
#   structure   — the conformant file set, the compose files and every landing page
#   secrets     — the scanner passes its own self-test, then the tracked tree
#   training    — the IT support training app: typecheck, unit tests, build
#   tix         — OnTrak Tix: typecheck, unit tests, build
#   sentinel    — OnTrak Sentinel: migrations applied, then typecheck and unit tests
#   roundtrip   — the Sentinel image boots and signs somebody in over the wire
#   genie       — the agent console: typecheck, build, unit and HTTP tests
#   family      — the whole family stack boots together and the wiring between the
#                 products holds
#   images      — every container image actually builds, one matrix entry per product
#
# Both apps talk to PostgreSQL (through Prisma) and are exercised against a
# real database here, because a suite that only passes against fakes proves
# nothing about the SQL it actually issues. The training app ships migrations
# and applies them; Tix is schema-first (no migrations directory) and pushes.
# Attribution is enforced separately, in attribution-guard.yml.
# ═══════════════════════════════════════════════════════════════════════════

name: CI

# `family` is where the family is assembled, so a push there runs CI too: the branch
# that reaches a deploy is the branch whose images have to be proven to build.
on:
  push:
    branches: [main, master, family]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: Repository structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Conformant structure
        run: |
          set -euo pipefail
          for f in README.md LICENSE .env.example .gitignore web/landing/index.html docs/stack.md; do
            if [ ! -f "$f" ]; then
              echo "::error::missing required file: $f"
              exit 1
            fi
          done
          echo "structure: ok"

      - name: .gitignore covers .env
        run: |
          set -euo pipefail
          grep -q '^\.env' .gitignore || { echo "::error::.gitignore does not list .env"; exit 1; }
          echo "gitignore: ok"

      # Four compose files and three `.env.example`s, checked as a set: a family
      # stack that no longer parses is a broken "one command" that only a person
      # trying it would find.
      - name: Every compose file parses
        run: |
          set -euo pipefail
          cp -n .env.example .env
          cp -n ontrak-tix/.env.example ontrak-tix/.env
          docker compose config --quiet && echo "compose: training ok"
          ( cd ontrak-tix && docker compose config --quiet ) && echo "compose: tix ok"
          ( cd ontrak-sentinel && docker compose config --quiet ) && echo "compose: sentinel ok"
          docker compose -f docker-compose.all.yml config --quiet && echo "compose: family ok"

      # Every landing in the tree, not only the front door. `pages.yml` publishes
      # each product's landing at its own path under the family site, so a product
      # landing that lost its favicon or picked up attribution text ships broken
      # exactly as visibly as the root one would.
      - name: Landing page sanity
        run: |
          set -euo pipefail
          for f in web/landing/index.html */web/landing/index.html; do
            [ -f "$f" ] || continue
            grep -qi '<title>' "$f" || { echo "::error::$f has no <title>"; exit 1; }
            grep -qi 'og:title' "$f" || { echo "::error::$f has no og:title"; exit 1; }
            grep -qi 'data:image/svg+xml' "$f" || { echo "::error::$f favicon is not a self-contained SVG"; exit 1; }
            grep -Eiq 'generated with|generated by|co-authored-by' "$f" && { echo "::error::$f carries attribution text"; exit 1; }
            echo "landing: $f ok"
          done

      # Every product vendors the shared theme byte-for-byte, so the first sign the
      # family is drifting apart is somebody fixing one copy. A diff is the check that
      # cannot be argued with; `--update` is how a real theme change is rolled out.
      - name: Unity theme copies are byte-identical
        run: python3 theme/tests/test_theme_copies.py

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # First, because this is the step that catches the failure nobody sees: a
      # scanner whose patterns have stopped matching reports a clean tree.
      - name: The scanner must still fire
        run: python3 scripts/secret-scan.py --selftest

      - name: Scan the tracked tree
        run: python3 scripts/secret-scan.py

  training:
    name: Training app
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ontrak
          POSTGRES_PASSWORD: ontrak
          POSTGRES_DB: ontrak
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ontrak"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ontrak:ontrak@127.0.0.1:5432/ontrak?schema=public
      AUTH_SECRET: ci-only-not-a-production-secret-value
      # The shipped placeholder, so the seeded demo accounts the a11y-free
      # suites sign in as exist without CI holding a real credential.
      SEED_PASSWORD: change-me-ontrak
      STORAGE_DIR: ./storage/packages
      NEXT_PUBLIC_APP_NAME: OnTrak IT Support Training
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate the Prisma client and apply migrations
        run: |
          npx prisma generate
          npx prisma migrate deploy

      # Applied migrations are compared against the models, so a hand-edited SQL
      # file cannot quietly describe a different schema than the one Prisma thinks
      # it is talking to — the failure mode that only shows up in production.
      - name: No drift between the migrations and the models
        run: |
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  tix:
    name: OnTrak Tix
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ontrak
          POSTGRES_PASSWORD: ontrak
          POSTGRES_DB: ontrak_tix
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ontrak"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ontrak:ontrak@127.0.0.1:5432/ontrak_tix
      TIX_AUTH_SECRET: ci-only-not-a-production-secret-value
      ONTRAK_TIX_WEBHOOK_SECRET: ci-only-not-a-production-secret-value
      ONTRAK_TIX_RMM_SECRET: ci-only-not-a-production-secret-value
      ONTRAK_TIX_CRON_SECRET: ci-only-not-a-production-secret-value
      ONTRAK_TIX_ASSURANCE_SECRET: ci-only-not-a-production-secret-value
      ONTRAK_TIX_BLOB_DIR: .ontrak-tix-blobs
      ONTRAK_TIX_EVIDENCE_DIR: .ontrak-tix-evidence
    defaults:
      run:
        working-directory: ontrak-tix
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ontrak-tix/package-lock.json

      - name: Install
        run: npm ci

      - name: Generate the Prisma client and sync the schema
        run: |
          npx prisma generate
          npx prisma db push

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # OnTrak Sentinel, whose S0 exit criterion is that tenant isolation is covered
  # by CI tests. Every migration is applied here, because a migration that does
  # not apply is not a migration: the OIDC tables arrive in the second, SAML
  # service providers and token revocation in the third, TOTP enrollment state in
  # the fourth, WebAuthn credentials and challenges in the fifth, provisioning
  # (SCIM tokens, groups and `Identity.externalId`) in the sixth, and the live
  # Postgres test runs against the result. The migrations are also diffed against
  # the models, so a hand-edited SQL file cannot quietly drift from the schema it
  # is supposed to create.
  sentinel:
    name: OnTrak Sentinel
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ontrak
          POSTGRES_PASSWORD: ontrak
          POSTGRES_DB: sentinel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ontrak"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ontrak:ontrak@127.0.0.1:5432/sentinel?schema=public
    defaults:
      run:
        working-directory: ontrak-sentinel
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ontrak-sentinel/package-lock.json

      - name: Install
        run: npm ci

      - name: Generate the Prisma client and apply every migration
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: No drift between the migrations and the models
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$DATABASE_URL" \
            --exit-code

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  # The unit suite tests the rules and the live store test tests the SQL, and
  # neither of them answers the question a deployment actually has: does the thing
  # in the image sign somebody in, over the wire, with the key it is holding right
  # now? So this boots the stack a deployment would use — the compose file itself,
  # which is the artefact under test — and drives a full authorization-code flow
  # through it, verifying the ID token against the JWKS the container serves.
  #
  # It is deliberately here rather than folded into the `sentinel` job: that one
  # runs the source against a Postgres service, this one runs the image. A broken
  # Dockerfile, a missing `openssl`, a volume that never gets created — all three
  # pass the first and fail this one.
  sentinel-roundtrip:
    name: Sentinel round trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ontrak-sentinel/package-lock.json

      - name: Install
        working-directory: ontrak-sentinel
        run: npm ci

      # The issuer is set here rather than in a `.env`, which is gitignored: this
      # is the address the provider will advertise, so it has to be one the smoke
      # check can also reach.
      - name: Boot the stack
        working-directory: ontrak-sentinel
        env:
          SENTINEL_ISSUER: http://127.0.0.1:8787
        run: |
          set -euo pipefail
          docker compose up -d --build
          # Polled rather than `--wait`: the stack has two one-shot services by
          # design (`migrate` and `signing-key`), and waiting on them to be
          # "running" would be waiting for something that is supposed to finish.
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/.well-known/openid-configuration >/dev/null 2>&1; then
              echo "provider is up"
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8787/.well-known/openid-configuration >/dev/null || {
            echo "::error::the provider never answered discovery"
            exit 1
          }
          docker compose logs app > /tmp/sentinel.log
          cat /tmp/sentinel.log

      - name: Full authorization-code round trip
        working-directory: ontrak-sentinel
        run: |
          set -euo pipefail
          session=$(grep -o 'demo session: [0-9a-f-]*' /tmp/sentinel.log | head -1 | cut -d' ' -f3)
          client=$(grep -o 'demo client: [0-9a-f-]*' /tmp/sentinel.log | head -1 | cut -d' ' -f3)
          test -n "$session" || { echo "::error::no bootstrap session in the boot log"; exit 1; }
          test -n "$client" || { echo "::error::no demo client in the boot log"; exit 1; }
          SENTINEL_SMOKE_BASE=http://127.0.0.1:8787 \
          SENTINEL_SMOKE_CLIENT="$client" \
          SENTINEL_SMOKE_SESSION="$session" \
            npx tsx scripts/smoke.ts

      # The image warns on an ephemeral key rather than failing, because that is
      # right for a scratch run. In a stack it means the key volume did not work,
      # and the provider would silently stop verifying its own tokens on the next
      # restart — so here it is a failure.
      - name: The signing key came from the volume, not from a generator
        run: |
          set -euo pipefail
          if grep -q 'ephemeral key' /tmp/sentinel.log; then
            echo "::error::the provider generated an ephemeral key: the signing-key service did not do its job"
            exit 1
          fi
          echo "signing key: supplied"

      - name: The stack's logs
        if: failure()
        working-directory: ontrak-sentinel
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        working-directory: ontrak-sentinel
        run: docker compose down -v

  # OnTrak Sync is the one product whose service is not a Node app, so its suite is
  # not run by any of the jobs above: it is `unittest`, run with the interpreter, and
  # the image build only proves it compiles. Without this job the parsers that decide
  # what an operator is told to install on every host in the Network would be the only
  # ones in the family with nothing checking them on a push.
  sync:
    name: OnTrak Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 3.12 because that is what the API's image is built on. The suite itself is the
      # standard library plus one library (`cryptography`, for verifying an SSO ID
      # token), so there is nothing else to install and no test tooling at all.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the API's dependencies
        run: pip install -r ontrak-sync/backend/requirements.txt

      # `run-all.py` discovers `test_*.py`, so a new module is covered by being
      # written. It runs in the same shape the deployed image runs it in.
      - name: API tests
        run: python3 ontrak-sync/backend/tests/run-all.py

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ontrak-sync/web/package-lock.json

      # 22 because that is what the dashboard's image is built on; a typecheck on a
      # different major would pass here and fail in the image.
      - name: Install the dashboard's dependencies
        run: npm ci
        working-directory: ontrak-sync/web

      - name: Dashboard typecheck
        run: npm run typecheck
        working-directory: ontrak-sync/web

  # OnTrak Genie is where the family's toolchain work is watched, and its suite is
  # the only thing standing between a turn and a real workspace: the jail that
  # refuses an escape, the approval gate, the OIDC verifier and the factory
  # handoff are all covered there. It builds before it tests, because `npm test`
  # runs the compiled suite (`node --test dist/test/*.test.js`) — the same files
  # the image executes, so a green run here is a green run against the shipped
  # shape rather than against the source.
  #
  # The browser checks (`npm run ui:smoke`, part of `npm run check`) are
  # deliberately not run here: they drive a real Chrome over the console, and they
  # are the workstation gate before a push rather than a per-push cost.
  genie:
    name: OnTrak Genie
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ontrak-genie
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 22 because that is what Genie's image is built on; a suite green on a
          # different major would still be one that never ran in the container.
          node-version: 22
          cache: npm
          cache-dependency-path: ontrak-genie/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit and HTTP tests
        run: npm test

  # The family stack — every product in one project — is the artefact behind
  # `make all-up`, so it is the thing to boot. The unit suites prove each product's
  # rules; this proves the *wiring between them*: a database per product on its own
  # port, one network, each app told its own public address, and a provider that
  # registers a client for each of the others because their callbacks were set.
  family:
    name: Family stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Boot every product together
        run: |
          set -euo pipefail
          cp -n .env.example .env
          cp -n ontrak-tix/.env.example ontrak-tix/.env
          # Placeholders: this job checks wiring, not secrets. The prod overlays are
          # the ones that refuse to start without real values, and they are not used
          # here.
          AUTH_SECRET=ci-only-not-a-production-secret-value \
          TIX_AUTH_SECRET=ci-only-not-a-production-secret-value \
            docker compose -f docker-compose.all.yml up -d --build

          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null 2>&1 \
              && curl -fsS http://127.0.0.1:3001/sign-in >/dev/null 2>&1 \
              && curl -fsS http://127.0.0.1:8787/.well-known/openid-configuration >/dev/null 2>&1; then
              echo "all three products are up"
              break
            fi
            sleep 4
          done

      - name: The training app answers
        run: curl -fsS -o /dev/null http://127.0.0.1:3000/login

      - name: The desk answers
        run: curl -fsS -o /dev/null http://127.0.0.1:3001/sign-in

      - name: The provider answers discovery
        run: curl -fsS http://127.0.0.1:8787/.well-known/openid-configuration | grep -q authorization_endpoint

      # A registered client is the half of single sign-on that can silently not
      # happen: the callbacks are only registered when the family stack supplies
      # them, and without the client id the products cannot sign anybody in.
      - name: The provider registered a client for each product
        run: |
          set -euo pipefail
          docker compose -f docker-compose.all.yml logs sentinel-app > /tmp/family.log
          grep -q 'OnTrak Tix client:' /tmp/family.log || { echo "::error::no Tix client was registered"; exit 1; }
          grep -q 'training client:' /tmp/family.log || { echo "::error::no training client was registered"; exit 1; }
          echo "clients: registered"

      # The desk's outbound provisioning must name the provider over the *network*:
      # inside its container, `localhost` is the desk itself, so a value copied from
      # a host-oriented `.env` would be the one wire that silently points nowhere.
      - name: The desk is pointed at the provider over the network
        run: |
          set -euo pipefail
          wired=$(docker compose -f docker-compose.all.yml exec -T tix-app printenv ONTRAK_TIX_SCIM_BASE_URL)
          test "$wired" = "http://sentinel-app:8787" || { echo "::error::the desk is pointed at $wired"; exit 1; }
          echo "scim target: $wired"

      - name: The family stack's logs
        if: failure()
        run: docker compose -f docker-compose.all.yml logs --no-color

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.all.yml down -v

  # The container image is what a deployment actually runs, so it is built on
  # every push rather than discovered broken at release time. This builds the
  # serving stage of each product and pushes nothing: publishing an image is a
  # deployment's decision, not CI's.
  #
  # Every product the family stack runs has an entry, and that is the point: a
  # build error in any one of them — an import path that resolves in the repo but
  # not inside the image's build context, say — is caught here, per product, with
  # the failing name on the check rather than surfacing as a deploy that half
  # worked.
  images:
    name: Image (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # `target` is per-entry because the products do not agree on the name of
          # their serving stage: the three Next apps end at `runner`, Portal, Sync and
          # Genie at `runtime`. Naming it is what makes this a build of the stage that
          # ships rather than of whichever stage happens to be last in the file.
          - app: training
            context: .
            target: runner
          - app: tix
            context: ontrak-tix
            target: runner
          - app: sentinel
            context: ontrak-sentinel
            target: runner
          - app: portal
            context: ontrak-portal
            target: runtime
          - app: sync
            context: ontrak-sync/web
            target: runtime
          - app: genie
            context: ontrak-genie
            target: runtime
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Cached, because an uncached build reinstalls every dependency and re-runs
      # `next build` for both apps on every push. `mode=max` keeps the builder
      # stage's layers as well, and those are where the time actually goes.
      - name: Build the ${{ matrix.app }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: ontrak-${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
