# ═══════════════════════════════════════════════════════════════════════════
# ci.yml — the checks that must be green on main.
#
# Six concerns, in the order they fail cheapest:
#   structure   — the conformant file set and the landing page's sanity
#   secrets     — the scanner passes its own self-test, then the tracked tree
#   training    — the IT support training app: typecheck, unit tests, build
#   tix         — OnTrak Tix: typecheck, unit tests, build
#   sentinel    — OnTrak Sentinel: migrations applied, then typecheck and unit tests
#   images      — both container images actually build
#
# Both apps talk to PostgreSQL (through Prisma) and are exercised against a
# real database here, because a suite that only passes against fakes proves
# nothing about the SQL it actually issues. The training app ships migrations
# and applies them; Tix is schema-first (no migrations directory) and pushes.
# Attribution is enforced separately, in attribution-guard.yml.
# ═══════════════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: Repository structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Conformant structure
        run: |
          set -euo pipefail
          for f in README.md LICENSE .env.example .gitignore web/landing/index.html docs/stack.md; do
            if [ ! -f "$f" ]; then
              echo "::error::missing required file: $f"
              exit 1
            fi
          done
          echo "structure: ok"

      - name: .gitignore covers .env
        run: |
          set -euo pipefail
          grep -q '^\.env' .gitignore || { echo "::error::.gitignore does not list .env"; exit 1; }
          echo "gitignore: ok"

      - name: Landing page sanity
        run: |
          set -euo pipefail
          f=web/landing/index.html
          grep -qi '<title>' "$f" || { echo "::error::landing has no <title>"; exit 1; }
          grep -qi 'og:title' "$f" || { echo "::error::landing has no og:title"; exit 1; }
          grep -qi 'data:image/svg+xml' "$f" || { echo "::error::landing favicon is not a self-contained SVG"; exit 1; }
          grep -Eiq 'generated with|generated by|co-authored-by' "$f" && { echo "::error::landing carries attribution text"; exit 1; }
          echo "landing: ok"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # First, because this is the step that catches the failure nobody sees: a
      # scanner whose patterns have stopped matching reports a clean tree.
      - name: The scanner must still fire
        run: python3 scripts/secret-scan.py --selftest

      - name: Scan the tracked tree
        run: python3 scripts/secret-scan.py

  training:
    name: Training app
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ontrak
          POSTGRES_PASSWORD: ontrak
          POSTGRES_DB: ontrak
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ontrak"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ontrak:ontrak@127.0.0.1:5432/ontrak?schema=public
      AUTH_SECRET: ci-only-not-a-production-secret-value
      # The shipped placeholder, so the seeded demo accounts the a11y-free
      # suites sign in as exist without CI holding a real credential.
      SEED_PASSWORD: change-me-ontrak
      STORAGE_DIR: ./storage/packages
      NEXT_PUBLIC_APP_NAME: OnTrak IT Support Training
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate the Prisma client and apply migrations
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  tix:
    name: OnTrak Tix
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ontrak
          POSTGRES_PASSWORD: ontrak
          POSTGRES_DB: ontrak_tix
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ontrak"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ontrak:ontrak@127.0.0.1:5432/ontrak_tix
      TIX_AUTH_SECRET: ci-only-not-a-production-secret-value
      ONTRAK_TIX_WEBHOOK_SECRET: ci-only-not-a-production-secret-value
      ONTRAK_TIX_RMM_SECRET: ci-only-not-a-production-secret-value
      ONTRAK_TIX_CRON_SECRET: ci-only-not-a-production-secret-value
      ONTRAK_TIX_ASSURANCE_SECRET: ci-only-not-a-production-secret-value
      ONTRAK_TIX_BLOB_DIR: .ontrak-tix-blobs
      ONTRAK_TIX_EVIDENCE_DIR: .ontrak-tix-evidence
    defaults:
      run:
        working-directory: ontrak-tix
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ontrak-tix/package-lock.json

      - name: Install
        run: npm ci

      - name: Generate the Prisma client and sync the schema
        run: |
          npx prisma generate
          npx prisma db push

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # OnTrak Sentinel, whose S0 exit criterion is that tenant isolation is covered
  # by CI tests. Every migration is applied here, because a migration that does
  # not apply is not a migration: the OIDC tables arrive in the second, SAML
  # service providers and token revocation in the third, TOTP enrollment state in
  # the fourth, WebAuthn credentials and challenges in the fifth, provisioning
  # (SCIM tokens, groups and `Identity.externalId`) in the sixth, and the live
  # Postgres test runs against the result. The migrations are also diffed against
  # the models, so a hand-edited SQL file cannot quietly drift from the schema it
  # is supposed to create.
  sentinel:
    name: OnTrak Sentinel
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ontrak
          POSTGRES_PASSWORD: ontrak
          POSTGRES_DB: sentinel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ontrak"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ontrak:ontrak@127.0.0.1:5432/sentinel?schema=public
    defaults:
      run:
        working-directory: ontrak-sentinel
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ontrak-sentinel/package-lock.json

      - name: Install
        run: npm ci

      - name: Generate the Prisma client and apply every migration
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: No drift between the migrations and the models
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$DATABASE_URL" \
            --exit-code

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  # The container image is what a deployment actually runs, so it is built on
  # every push rather than discovered broken at release time. This builds the
  # serving stage of each app and pushes nothing: publishing an image is a
  # deployment's decision, not CI's.
  images:
    name: Image (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: training
            context: .
          - app: tix
            context: ontrak-tix
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Cached, because an uncached build reinstalls every dependency and re-runs
      # `next build` for both apps on every push. `mode=max` keeps the builder
      # stage's layers as well, and those are where the time actually goes.
      - name: Build the ${{ matrix.app }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: runner
          push: false
          load: true
          tags: ontrak-${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
