# ═══════════════════════════════════════════════════════════════════════════
# conform.yml — audit this repo against the Innotel Platform Stack standard.
#
# The standard (README shape, landing outline, attribution guard, docs/stack.md,
# .env.example posture, license posture, Pages reachability) is defined once in
# innotelinc/innotel-platform-stack and enforced by its conform-project.sh. This
# workflow checks that repo out beside us and runs the audit against this one, so
# a repo that drifts from the shared layers fails here instead of being noticed
# later. Fixes belong in this repo, never in the audit script.
# ═══════════════════════════════════════════════════════════════════════════

name: Conformity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Conformity audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the stack repo (standard + audit script)
        uses: actions/checkout@v7
        with:
          repository: innotelinc/innotel-platform-stack
          path: .stack

      - name: Run the conformity audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          bash .stack/scripts/conform-project.sh . | tee /tmp/conform.out
          if grep -q '✗' /tmp/conform.out; then
            echo "::error::Conformity audit found failures — see the log above."
            exit 1
          fi
          echo "conformity audit: clean"
