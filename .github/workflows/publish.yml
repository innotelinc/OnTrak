# ═══════════════════════════════════════════════════════════════════════════
# publish.yml — the one workflow that writes to a registry.
#
# ci.yml builds every image on every push so they cannot rot; this publishes
# them, and only when a release is published — or when an operator asks by hand.
# The two are kept apart on purpose: a push to main must never produce a tag an
# environment could pull without someone having decided to release.
#
# Images land at:
#   ghcr.io/<owner>/ontrak-training
#   ghcr.io/<owner>/ontrak-tix
#   ghcr.io/<owner>/ontrak-sentinel
#   ghcr.io/<owner>/ontrak-genie
#   ghcr.io/<owner>/ontrak-{training,tix,sentinel}-migrate
#
# **The `-migrate` images are what make a deployment pull-only.** The prod overlays
# fetch their images rather than building them, and the migration runs in the
# `builder` stage — which the serving image deliberately leaves out, because it
# carries the Prisma CLI and the schema tree that a running app does not need. A
# release that published only the serving images would leave every deployment
# building the migration on the host, which is the thing pulling was meant to stop.
# Sentinel is here rather than only in the host-built stack because its overlay
# pulls too. `scripts/publish-images.sh` mirrors this list exactly, so a release cut
# here and an image pushed by hand are the same artifact under the same name.
#
# A release tags them `latest` plus the version and its major.minor; a manual
# run tags them by commit, so it can prove the pipeline without minting a
# version anyone might deploy.
# ═══════════════════════════════════════════════════════════════════════════

name: Publish images

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # The only elevated permission any workflow here asks for, and it is scoped to
  # this job: pushing to GHCR needs `packages: write`.
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  # Never cancel mid-push: a half-uploaded tag is worse than a slow one.
  cancel-in-progress: false

jobs:
  publish:
    name: Publish (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # `target` is per-entry, and it has to be: the products do not agree on
          # the name of their serving stage (Training and Tix end at `runner`,
          # Genie at `runtime`), and each product's migration is a different stage
          # again (`builder`). Naming it is what makes this a publish of the stage
          # that ships rather than of whichever stage happens to be last in the
          # Dockerfile.
          - app: training
            context: .
            target: runner
          - app: training-migrate
            context: .
            target: builder
          - app: tix
            context: ontrak-tix
            target: runner
          - app: tix-migrate
            context: ontrak-tix
            target: builder
          - app: sentinel
            context: ontrak-sentinel
            target: runner
          - app: sentinel-migrate
            context: ontrak-sentinel
            target: builder
          - app: genie
            context: ontrak-genie
            target: runtime
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ontrak-${{ matrix.app }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
