# ═══════════════════════════════════════════════════════════════════════════
# range-nightly.yml — the student lifecycle, walked on a real range.
#
# Everything in ci.yml tests a layer with the layers under it doubled: the session
# manager against FakeIncus, the portal against those, the theme against rendered
# markup. That is the right way to pin behaviour and it is deliberately blind to one
# thing — whether the layers agree on a *real machine*. A fault that never made it
# into the snapshot, a check that grades the injection rather than the student's
# work, a page that drops the hand-in button once the practice check passes: all
# three pass every test in ci.yml.
#
# tests/test_range_end_to_end.py walks it whole. It boots a VM, so it cannot run on a
# GitHub-hosted runner; it runs here, on a self-hosted runner labelled `incus`, once
# a night and on demand.
#
# The one failure mode this file exists to prevent is a *silent* pass: the test skips
# itself when there is no hypervisor, and a skipped pytest is a green pytest. A
# nightly that skips every night is worse than no nightly, because it reads as
# coverage. So the walk is asserted to have actually run, and a skip is an error.
#
# The same job then opens every Linux console (`ontrak console verify --linux
# --workloads`), which is the layer the walk cannot see, and holds that sweep to the same
# rule: a run that opened nothing is not a pass either. Last it opens one scenario's
# console in a real browser (`ontrak console browser`), because the wire sweep knows
# nothing about the page a student actually looks at — a frame that never loads, a
# bootstrap page on another origin, a canvas no keystroke reaches.
# ═══════════════════════════════════════════════════════════════════════════

name: Range walk

on:
  schedule:
    # 03:17 UTC — outside class hours in every region the range is used from, and off
    # the hour so it does not contend with the other cron jobs on the host.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One walk at a time, and the newest wins: two of these on one range would take each
# other's machines, and a queued backlog of them tells nobody anything.
concurrency:
  group: range-walk
  cancel-in-progress: true

jobs:
  range-walk:
    name: Student walk on a live range
    # Only a host that really has Incus takes this job. The label is the gate; the
    # preflight below is what turns "the label is wrong" into a clear error rather
    # than a skipped test that reports success.
    runs-on: [self-hosted, linux, incus]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Preflight — this host is a range
        run: |
          set -euo pipefail
          command -v incus >/dev/null 2>&1 \
            || { echo "::error::this runner has no incus binary; the 'incus' label is wrong"; exit 1; }
          incus version
          # The walk uses the range's real project, so it has to exist before anything
          # is booted; a wrong project name would otherwise surface as a skip.
          project="${ONTRAK_INCUS__PROJECT:-ontrak}"
          incus project show "$project" >/dev/null \
            || { echo "::error::incus project '$project' does not exist on this host"; exit 1; }
          templates="$(incus list --project "$project" --format csv -c n | grep -c '^tpl-' || true)"
          echo "templates in $project: $templates"
          if [ "$templates" -eq 0 ]; then
            echo "::error::no templates in project '$project' — build the pool before walking it"
            exit 1
          fi

      - name: Install
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install -e .

      # The engine for `ontrak console browser` below is a download of its own (about
      # 170 MB), deliberately not part of requirements.txt: a range that only runs the
      # wire checks should not have to carry it. The browser check is the one step here
      # that asks a *page* what a student sees, so this is where it belongs.
      - name: Install the browser engine the console check drives
        run: |
          set -euo pipefail
          # `--with-deps` installs the shared libraries Chromium needs and needs root; a
          # runner that cannot sudo still gets the engine, and the check names the missing
          # libraries in its own words if the launch fails without them.
          .venv/bin/python -m playwright install --with-deps chromium \
            || .venv/bin/python -m playwright install chromium
          .venv/bin/python -c "from ontrak import browser; raise SystemExit(browser.engine_missing() or 0)"

      - name: Walk the lifecycle
        env:
          ONTRAK_E2E: "1"
        run: |
          set -euo pipefail
          .venv/bin/python -m pytest tests/test_range_end_to_end.py \
            -p no:cacheprovider -p no:warnings -q --junitxml=/tmp/range-walk.xml

      # A skipped pytest is a green pytest, and this test skips itself whenever there
      # is no hypervisor, no template, or no scenario the range can start. A nightly
      # that skips every night reads as coverage while covering nothing — so the run
      # is asserted here, on the machine, rather than trusted to the exit code.
      - name: The walk actually ran
        if: always()
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import xml.etree.ElementTree as ET

          try:
              root = ET.parse("/tmp/range-walk.xml").getroot()
          except (OSError, ET.ParseError) as exc:
              raise SystemExit(f"::error::the walk produced no result file: {exc}")

          tests = sum(int(s.get("tests", 0)) for s in root.iter("testsuite"))
          skipped = sum(int(s.get("skipped", 0)) for s in root.iter("testsuite"))
          ran = tests - skipped
          print(f"tests={tests} skipped={skipped} ran={ran}")
          if ran < 1:
              raise SystemExit(
                  "::error::the range walk did not run — it skipped itself, which is not a pass"
              )
          PY

      # The walk proves a student can *reach* the machine. It never opens the thing they
      # work in: that is a WebSocket through the gateway, the webapp and guacd, and any of
      # the three can be down while the walk passes every assertion it makes. So each Linux
      # console is opened the way a browser opens it, against a real machine, and destroyed
      # again — the same three requests, in the same order, over the real stack.
      - name: Every Linux console opens, on every platform it is offered on
        run: |
          set -euo pipefail
          command -v curl >/dev/null 2>&1 \
            || { echo "::error::curl is missing from this runner, so the console address cannot be found"; exit 1; }
          # `guac.base_url: auto` — the shipped default — follows each *browser's* own
          # address, so a process has to be told one. ONTRAK_CONSOLE_URL wins; otherwise the
          # two addresses a range publishes for itself are tried in order.
          url=""
          for candidate in "${ONTRAK_CONSOLE_URL:-}" \
                           "https://127.0.0.1:8443/guacamole/" \
                           "http://127.0.0.1:8080/guacamole/"; do
            [ -n "$candidate" ] || continue
            code="$(curl -sk -o /dev/null -w '%{http_code}' --max-time 10 "$candidate" || true)"
            echo "$candidate -> ${code:-no answer}"
            case "$code" in
              200|302|303) url="$candidate"; break ;;
            esac
          done
          if [ -z "$url" ]; then
            echo "::error::no console answered on this host — set ONTRAK_CONSOLE_URL, e.g. https://localhost:8443/guacamole/"
            exit 1
          fi
          # `--workloads` is what makes "every Linux console" true: a scenario offered on
          # Ubuntu *and* Debian is two templates and two machines, and the default would
          # open whichever the catalogue lists first while reporting a green sweep.
          .venv/bin/ontrak console verify --linux --workloads --base-url "$url" | tee /tmp/console-verify.txt

          # `0 of 14 console(s) opened, 14 skipped` exits 0: a range whose Linux templates
          # predate `guac.linux_ssh`, or one whose catalogue has no Linux scenario, would
          # otherwise report a green nightly that opened nothing. The walk's own skip check
          # exists for exactly this shape of lie, so this one demands the sweep opened every
          # console it asked for rather than merely that none failed.
          .venv/bin/python - <<'PY'
          import re
          import sys

          text = open("/tmp/console-verify.txt", encoding="utf-8").read()
          match = re.search(r"(\d+) of (\d+) console\(s\) opened", text)
          if not match:
              raise SystemExit("::error::the console sweep printed no summary line")
          opened, total = int(match.group(1)), int(match.group(2))
          print(f"consoles opened={opened} targets={total}")
          if total < 1 or opened != total:
              raise SystemExit(
                  f"::error::only {opened} of {total} Linux consoles opened — the console a "
                  "student works in is broken, and the lifecycle walk cannot see that"
              )
          PY

      # The wire sweep proves the stack. This proves the *page*: it signs in to the real
      # portal, starts the scenario through the portal, opens the session page in Chromium
      # and types into the terminal. It is the only step here that can see a console which
      # is perfect on the wire and blank in the browser a student is looking at.
      - name: The student's console page, in a real browser
        run: |
          set -euo pipefail
          command -v curl >/dev/null 2>&1 \
            || { echo "::error::curl is missing from this runner, so the portal address cannot be found"; exit 1; }
          # The portal's own address this time, not the console's: the check loads the
          # session page and lets the portal embed the frame, which is the whole point.
          portal=""
          for candidate in "${ONTRAK_PORTAL_URL:-}" \
                           "https://127.0.0.1:8443/" \
                           "http://127.0.0.1:8080/"; do
            [ -n "$candidate" ] || continue
            code="$(curl -sk -o /dev/null -w '%{http_code}' --max-time 10 "${candidate}login" || true)"
            echo "${candidate}login -> ${code:-no answer}"
            case "$code" in
              200) portal="$candidate"; break ;;
            esac
          done
          if [ -z "$portal" ]; then
            echo "::error::no portal answered on this host — set ONTRAK_PORTAL_URL, e.g. https://localhost:8443/"
            exit 1
          fi
          # An account that can open a session: an instructor sees any session's page. The
          # range's own admin password is the default, and a runner that should not hold it
          # can set ONTRAK_BROWSER_USER/ONTRAK_BROWSER_PASSWORD to an account kept for this.
          user="${ONTRAK_BROWSER_USER:-${ONTRAK_PORTAL__ADMIN_USERNAME:-admin}}"
          if [ -n "${ONTRAK_BROWSER_PASSWORD:-}" ]; then
            password="$ONTRAK_BROWSER_PASSWORD"
          elif [ -n "${ONTRAK_PORTAL__ADMIN_PASSWORD:-}" ]; then
            password="$ONTRAK_PORTAL__ADMIN_PASSWORD"
          else
            echo "::error::the browser check needs an account it can sign in with: set ONTRAK_BROWSER_USER and ONTRAK_BROWSER_PASSWORD (or ONTRAK_PORTAL__ADMIN_PASSWORD)"
            exit 1
          fi
          .venv/bin/ontrak console browser "${ONTRAK_BROWSER_SCENARIO:-linux-user-lifecycle}" \
            --portal-url "$portal" \
            --browser-user "$user" \
            --browser-password "$password" \
            --seconds 60 \
            --wait 420

      - name: What the range looked like on failure
        if: failure()
        run: |
          project="${ONTRAK_INCUS__PROJECT:-ontrak}"
          echo "--- instances ---"
          incus list --project "$project" --format table || true
          # Deliberately read-only. This job runs against a range that may have a class
          # on it, and the walk's own sessions cannot be told apart from a student's by
          # name — `ontrak-sess-<scenario>-<platform>-<id>` is the same shape for both.
          # So this reports rather than deletes: the test ends its own session in a
          # `finally`, and anything a killed run leaves behind is reclaimed by the
          # deployed range's reaper at TTL like any other abandoned session.
          echo "--- session machines ---"
          incus list --project "$project" --format csv -c n \
            | grep -E '^ontrak-sess-' || echo "(none)"
