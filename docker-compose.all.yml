# ═══════════════════════════════════════════════════════════════════════════
# OnTrak — the whole family in one stack.
#
#   make all-up        (or: docker compose -f docker-compose.all.yml up -d --build)
#
# Six products, one command: the portal on :3300, the training app on :3000, the
# service desk on :3001, the identity provider on :8787, OnTrak Sync on
# :8420/:8421, and the agent console on :3400. The product stacks
# remain — `make up`, `make tix-up`, `make sentinel-up`, `make sync-up`, `make genie-up` — and this
# file is for running the family together, which is the only arrangement where the
# wiring between them can be checked in one go.
#
# ## Why OnTrak Sync is in the middle of it
#
# Sync owns the family's *local* account table, so the portal's password sign-in is
# delegated to it (`ONTRAK_SYNC_API_URL`) rather than the portal inventing a second
# login. Cerulean (Authentik) remains the directory; Sync is what a deployment
# falls back to, and what a LAN with no route to the provider signs in against.
#
# ## Why the portal is the front door
#
# Every other address below is behind a role. The portal is what decides *which* —
# it reads the role from the assertion or from Sync and draws only the products
# that role belongs in. It has no database, so a restart loses nothing.
#
# ## Why the services are renamed here
#
# Every product stack calls its services `db`, `app` and `migrate`, and compose
# requires service names to be unique inside a project — so one file cannot simply
# include three. Here each service is prefixed with its product, and the *values*
# (images, build stages, commands, healthchecks) are the same as the product files.
# Ports are the ones the family already reserves: 3000/5432 training,
# 3001/5433 Tix, 8787/5434 Sentinel, 3400 Genie (which has no database), and 8080
# for the lab's console gateway — the one service here that is not a product but the
# training range's own, and the one name (`lab.ontrak.innotel.us`) the family's edge
# already forwards for it.
#
# ## Which interface a port is published on
#
# Every app's port is written `<host>:<port>:<port>`, where the host is
# `${ONTRAK_<PRODUCT>_BIND_HOST:-0.0.0.0}` — so the default is the same "reachable
# from anywhere" a bare `"3000:3000"` gave, and a deployment that wants the stack
# only on its LAN sets the host in `.env` (`.env.example` has the group).
# Binding to a fixed address in this file would be a default that fails on every
# host without it: CI boots this stack on a runner whose interfaces the file cannot
# know, and a machine that cannot bind the address brings the whole family up
# "healthy" with nothing reachable.
#
# The three databases also take `${ONTRAK_<PRODUCT>_DB_BIND_HOST}`, and each is
# published **once** — not because a database has one caller but because a second
# mapping cannot be written here safely. dockerd refuses two mappings of one host
# port when the addresses overlap: the wildcard against any specific address, or
# one address twice, both fail with "failed to listen on TCP socket: address
# already in use", and `up -d` then aborts on whichever database lost the race.
# Since this file defaults to `0.0.0.0` and an operator's LAN address is a
# specific one, "loopback and the deployment's address" is exactly that overlap;
# on the wildcard default loopback is covered anyway. A deployment that wants
# loopback *and* its LAN address — and not the docker bridges the wildcard also
# opens, whose `172.x` addresses nothing but the containers on them can dial —
# adds `docker-compose.lan-db.yml`, which replaces these three mappings with that
# pair (`make all-up-lan`).
#
# ## What is wired up for you
#
#  - Each app talks to its own database over the network, never to 127.0.0.1 —
#    inside a container that address is the container itself.
#  - Each app is told its **own public address** (`ONTRAK_TRAINING_BASE_URL`,
#    `ONTRAK_TIX_BASE_URL`), which single sign-on needs: a redirect URI is matched
#    byte for byte against the one the provider registered, and a container that
#    builds it from the address its process is bound to sends `0.0.0.0:3000`.
#  - Sentinel registers a public OIDC client for each of the other two, because
#    both callbacks are set here. Each client id is printed in Sentinel's boot log
#    and is what the product's own configuration needs:
#      Tix     → `/admin/identity` on the desk.
#      Training→ `ONTRAK_OIDC_CLIENT_ID` in `.env`.
#  - **Tix's outbound provisioning is pointed at the provider over the network**
#    (`ONTRAK_TIX_SCIM_BASE_URL=http://sentinel-app:8787`). This one needs nothing
#    from the browser, so it works as-is once a connector token is supplied:
#    mint one at `http://localhost:8787/console/provisioning`, put it in
#    `ontrak-tix/.env` as `ONTRAK_TIX_SCIM_TOKEN`, and the desk's
#    `/admin/identity` page will push its people to the provider.
#
# ## What still needs a decision
#
# The two **browser-mediated** single sign-on hops need an address that *both* the
# browser and the app containers resolve, and the issuer is one identifier for
# both sides — the app fetches the discovery document from it and checks that the
# document names the same issuer, and the browser is redirected to its
# authorization endpoint. On one machine that means, in `.env`:
#
#   SENTINEL_ISSUER       the provider's address as the browser reaches it
#   ONTRAK_OIDC_ISSUER    the same value, for the training app
#   ONTRAK_OIDC_CLIENT_ID the client id from Sentinel's boot log
#
# `localhost` is right when the products run from source on the host and wrong
# from inside a container, which is why nothing is defaulted to it here. And
# Sentinel only registers a redirect URI that is `https`, or `http` on a loopback
# address — so a family served over plain HTTP at a LAN address can do SSO only
# once something terminates TLS in front of it. Both are stated rather than worked
# around, because both are the real deployment constraints.
# ═══════════════════════════════════════════════════════════════════════════

name: ontrak-family

services:
  # ── OnTrak IT Support Training ────────────────────────────────────────────
  training-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/New_York}
      POSTGRES_USER: ontrak
      POSTGRES_PASSWORD: ontrak
      POSTGRES_DB: ontrak
    ports:
      # One mapping, on the address this deployment publishes on. Two would be a
      # port published twice; see the header. Loopback comes with the wildcard
      # default, and `docker-compose.lan-db.yml` is the pair for a LAN deployment.
      - "${ONTRAK_DB_BIND_HOST:-0.0.0.0}:${ONTRAK_DB_PORT:-5432}:5432"
    volumes:
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - /etc/localtime:/etc/localtime:ro
      - ontrak-family-training-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontrak -d ontrak"]
      interval: 5s
      timeout: 5s
      retries: 10

  training-migrate:
    build:
      context: .
      target: builder
    command: npx prisma migrate deploy
    restart: "no"
    depends_on:
      training-db:
        condition: service_healthy
    environment:
      TZ: ${TZ:-America/New_York}
      DATABASE_URL: postgresql://ontrak:ontrak@training-db:5432/ontrak?schema=public

    volumes:
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - /etc/localtime:/etc/localtime:ro
  training-app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-OnTrak IT Support Training}
        NEXT_PUBLIC_ALLOW_SELF_REGISTRATION: ${NEXT_PUBLIC_ALLOW_SELF_REGISTRATION:-true}
    restart: unless-stopped
    depends_on:
      training-db:
        condition: service_healthy
      training-migrate:
        condition: service_completed_successfully
    ports:
      - "${ONTRAK_TRAINING_BIND_HOST:-0.0.0.0}:3000:3000"
    env_file:
      - .env
    environment:
      TZ: ${TZ:-America/New_York}
      DATABASE_URL: postgresql://ontrak:ontrak@training-db:5432/ontrak?schema=public
      STORAGE_DIR: ./storage/packages
      NODE_ENV: production
      # Its own address, for the SSO redirect URI. Defaults to the host port this
      # file publishes, which is right for a browser on this machine.
      ONTRAK_TRAINING_BASE_URL: ${ONTRAK_TRAINING_BASE_URL:-http://127.0.0.1:3000}
      # OnTrak Lab, served by this app (`/lab`). Passed through rather than
      # defaulted on: a deployment that has not asked for a lab gets exactly the
      # behaviour it had before the port. The lab's own settings
      # (`ONTRAK_<SECTION>__<KEY>`) arrive through the env file above.
      #
      # This container *is* the lab's control plane, and the hypervisor it drives is
      # named by `ONTRAK_INCUS__REMOTE` ("i2" — the lab host this box already trusts,
      # with its golden image and templates) rather than by a daemon on this box. The
      # image carries the `incus` client for it, the client's trust configuration is
      # mounted below, and the guests' network is routed here by
      # `ontrak-lab-route.service`. A deployment with no hypervisor to reach says so
      # with `ONTRAK_DEMO__ENABLED=1`, which needs no host at all.
      ONTRAK_LAB_ENABLED: ${ONTRAK_LAB_ENABLED:-}
      ONTRAK_LAB_URL: ${ONTRAK_LAB_URL:-}
      ONTRAK_LAB_IN_APP: ${ONTRAK_LAB_IN_APP:-}
      # Single sign-on, off until a client id is supplied (see the header).
      ONTRAK_OIDC_ISSUER: ${ONTRAK_OIDC_ISSUER:-}
      ONTRAK_OIDC_CLIENT_ID: ${ONTRAK_OIDC_CLIENT_ID:-}
      ONTRAK_OIDC_CLIENT_SECRET: ${ONTRAK_OIDC_CLIENT_SECRET:-}
    volumes:
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - /etc/localtime:/etc/localtime:ro
      - ontrak-family-training-storage:/app/storage
      # The lab's scenario tree, read by the ported control plane in this app
      # (`src/lib/lab/`, served at `/lab`). The scenarios are data, not build
      # input: the app reads them at runtime, so they are mounted rather than
      # baked into the image — editing a scenario is then a reload, not a
      # rebuild. Read-only, because the lab grades what a scenario *defines*
      # and never rewrites it.
      - ./scenarios:/app/scenarios:ro
      # The host's Incus, so this app can be the lab's control plane instead of
      # only linking to a peer's. The client in the image speaks to the daemon
      # over this socket; `/dev/kvm` is what lets a scenario be a *machine*
      # rather than a container. Both are only reachable if the process also
      # holds the right groups — `group_add` below names them by gid, because a
      # container cannot resolve the host's `incus-admin`/`kvm` names.
      #
      # The socket is the *single-host* way in, and a deployment pointed at a remote
      # (as this one is) does not use it. It is kept because it costs nothing and
      # makes the other mode a setting rather than an edit here.
      - /var/lib/incus/unix.socket:/var/lib/incus/unix.socket
      - /dev/kvm:/dev/kvm
      # The Incus CLI's trust configuration, which is the client certificate the remote
      # lab host has trusted plus the remote entry that names it — without it the
      # container's CLI knows no remote at all and every call answers `The remote "i2"
      # doesn't exist`, which is how a remote range fails every check while the stack
      # itself looks healthy. Read-only, since a client has nothing to write here, and
      # mounted at the *service account's* home because that is where the CLI looks
      # (`$HOME/.config/incus`) and the entrypoint's `setpriv` drop leaves HOME there.
      # The default is a readable copy of the operator's config directory: root's own is
      # 0700 and root-owned, so the app user cannot read it where it lives.
      - ${ONTRAK_INCUS_TRUST_DIR:-/etc/ontrak/incus-trust}:/home/nextjs/.config/incus:ro
    # gid 988 is the host's `incus-admin` (owns the daemon socket, mode 660) and
    # 993 its `kvm` (owns `/dev/kvm`, mode 660). Supplementary groups, so the
    # server still runs as the unprivileged `nextjs` user — it can talk to Incus
    # and open KVM, and nothing else changes.
    group_add:
      - "988"
      - "993"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  training-seed:
    build:
      context: .
      target: builder
    profiles: ["demo"]
    command: npm run setup
    restart: "no"
    depends_on:
      training-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      TZ: ${TZ:-America/New_York}
      DATABASE_URL: postgresql://ontrak:ontrak@training-db:5432/ontrak?schema=public

  # ── OnTrak Tix ────────────────────────────────────────────────────────────
    volumes:
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - /etc/localtime:/etc/localtime:ro

  # ── Guacamole: the lab's browser console ───────────────────────────────────
  # The training app's hands-on half hands a student a *machine*, and this is how
  # they watch it: the app mints a signed, encrypted, single-use payload scoped to
  # one guest (`src/lib/lab/guac.ts` — the `guacamole-auth-json` wire format) and the
  # browser opens `${ONTRAK_GUAC__BASE_URL}#/?data=…` in an iframe. Nothing else
  # renders a desktop, so without these two services `GET /lab/sessions/<id>/console`
  # has no gateway to hand the link to and redirects back to the session saying so:
  # the lab still starts, clones and grades machines, and no student can watch one
  # being fixed.
  #
  # These are the lab's own two services from the lab's own compose file
  # (`ontrak-lab/docker-compose.yml`), off-the-shelf upstream images: `guacd` does the
  # RDP/SSH work and the webapp renders it. `guacd` opens its connection *to the
  # guest's own address*, so it needs the route into the lab network (`10.20.0.0/24`,
  # `ontrak-lab-route.service` on this host) exactly as the app does — container egress
  # follows the host's routing table, so that unit is what this depends on.
  guacd:
    image: guacamole/guacd:1.6.0
    restart: unless-stopped
    init: true
    environment:
      TZ: ${TZ:-America/New_York}
    volumes:
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - /etc/localtime:/etc/localtime:ro
      # Only used when `guac.recording` is on, so an instructor can review a session
      # afterwards. A named volume rather than a host path, like the rest of the
      # family's state; both services share it because the webapp serves what guacd
      # writes.
      - ontrak-family-guac-recordings:/recordings

  guacamole:
    image: guacamole/guacamole:1.6.0
    restart: unless-stopped
    init: true
    depends_on:
      - guacd
    ports:
      # 8080 is the port the family already reserves for the lab: the edge forwards
      # `lab.ontrak.innotel.us` here and carries the websocket upgrade the console
      # tunnel needs (`scripts/cerulean-ontrak.py`), so the console gets a TLS name
      # rather than a bare port students would have to be told about. The path is
      # passed through unchanged, which is why `ONTRAK_GUAC__BASE_URL` keeps its
      # trailing `/guacamole/`: the webapp is deployed there and generates
      # base-relative URLs from it.
      - "${ONTRAK_GUAC_BIND_HOST:-0.0.0.0}:${ONTRAK_GUAC_BIND_PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-America/New_York}
      GUACD_HOSTNAME: guacd
      GUACD_PORT: "4822"
      # guacamole-auth-json — and the one value that has to agree across two services:
      # the app *signs* every console link with `ONTRAK_GUAC__SECRET_KEY` and this
      # extension *verifies* it with `JSON_SECRET_KEY`, so one secret names both. When
      # they drift the app keeps minting correct links, every student is answered
      # "Permission denied", and neither log says why — which is why `doctor` posts a
      # link it signed to this service and fails on the refusal.
      JSON_ENABLED: "true"
      JSON_SECRET_KEY: ${ONTRAK_GUAC__SECRET_KEY:-}
      LOG_LEVEL: ${ONTRAK_GUAC__LOG_LEVEL:-info}
    volumes:
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - /etc/localtime:/etc/localtime:ro
      - ontrak-family-guac-recordings:/recordings
    healthcheck:
      # The image is a Tomcat deployment; probe whichever HTTP client it ships.
      test:
        ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/guacamole/ >/dev/null 2>&1 || wget -q --spider http://127.0.0.1:8080/guacamole/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  tix-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/New_York}
      POSTGRES_USER: ontrak
      POSTGRES_PASSWORD: ontrak
      POSTGRES_DB: ontrak_tix
    ports:
      # As training-db: one mapping here, loopback included with the wildcard
      # default, and `docker-compose.lan-db.yml` for loopback plus a LAN address.
      - "${ONTRAK_TIX_DB_BIND_HOST:-0.0.0.0}:${ONTRAK_TIX_DB_PORT:-5433}:5432"
    volumes:
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - /etc/localtime:/etc/localtime:ro
      - ontrak-family-tix-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontrak -d ontrak_tix"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Tix is schema-first — no `prisma/migrations/` — so this pushes the schema
  # rather than deploying migrations.
  tix-migrate:
    build:
      context: ontrak-tix
      target: builder
    command: npx prisma db push
    restart: "no"
    depends_on:
      tix-db:
        condition: service_healthy
    environment:
      TZ: ${TZ:-America/New_York}
      DATABASE_URL: postgresql://ontrak:ontrak@tix-db:5432/ontrak_tix

    volumes:
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - /etc/localtime:/etc/localtime:ro
  tix-app:
    build:
      context: ontrak-tix
      target: runner
    restart: unless-stopped
    depends_on:
      tix-db:
        condition: service_healthy
      tix-migrate:
        condition: service_completed_successfully
    ports:
      - "${ONTRAK_TIX_BIND_HOST:-0.0.0.0}:3001:3000"
    env_file:
      - ontrak-tix/.env
    environment:
      TZ: ${TZ:-America/New_York}
      DATABASE_URL: postgresql://ontrak:ontrak@tix-db:5432/ontrak_tix
      ONTRAK_TIX_BLOB_DIR: .ontrak-tix-blobs
      ONTRAK_TIX_EVIDENCE_DIR: .ontrak-tix-evidence
      NODE_ENV: production
      ONTRAK_TIX_BASE_URL: ${ONTRAK_TIX_BASE_URL:-http://127.0.0.1:3001}
      # The single desk's workspace, so the sign-in page's SSO button works without
      # asking a person for an internal slug. Unset it for a multi-tenant install.
      ONTRAK_TIX_DEFAULT_TENANT: ${ONTRAK_TIX_DEFAULT_TENANT:-}
      # Where the provider is, for an inbound handshake: the desk discovers it from
      # this issuer and verifies the ID token's `iss` against it. See the header —
      # the browser has to reach this address too, and a container cannot interpret
      # `localhost` as the host.
      ONTRAK_TIX_OIDC_CLIENT_SECRET: ${ONTRAK_TIX_OIDC_CLIENT_SECRET:-}
      # Outbound provisioning (the desk's people, pushed to the provider). The
      # endpoint is the network name, because this is server-to-server and needs no
      # browser.
      #
      # The *token* is deliberately not named here. `environment:` beats
      # `env_file:`, and this block is interpolated against the family project's
      # `.env` — the repo root's — which is also the training app's `env_file`. A
      # credential named here would therefore come from the root file, where it
      # cannot be a `vault://` reference (the training app's entrypoint refuses to
      # boot with one it cannot resolve), and being empty here it would *shadow* the
      # reference the desk's own `.env` carries — a desk that boots with an empty
      # connector token and reports provisioning as unconfigured. The desk reads
      # `ONTRAK_TIX_SCIM_TOKEN` from `ontrak-tix/.env` (the `env_file` above) as
      # `vault://cerulean/ontrak/tix#ONTRAK_TIX_SCIM_TOKEN`, and resolves it at boot.
      ONTRAK_TIX_SCIM_BASE_URL: ${ONTRAK_TIX_SCIM_BASE_URL:-http://sentinel-app:8787}
    volumes:
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - /etc/localtime:/etc/localtime:ro
      - ontrak-family-tix-blobs:/app/.ontrak-tix-blobs
      - ontrak-family-tix-evidence:/app/.ontrak-tix-evidence
      # This stack's Cerulean Vault token, narrowed to cerulean/data/ontrak — the same
      # read-only mount Sentinel and Genie take. The desk needs it for the one value it
      # keeps in Vault (`ONTRAK_TIX_SCIM_TOKEN`, the outbound provisioning token in its
      # own `.env`): without the mount the entrypoint cannot resolve the reference and
      # refuses to boot, which is the designed behaviour — a container that started
      # anyway would be holding the literal `vault://…` as a credential.
      - ./data/vault/token/ontrak.token:/vault/token/ontrak.token:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/sign-in').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  tix-seed:
    build:
      context: ontrak-tix
      target: builder
    profiles: ["demo"]
    command: npm run setup
    restart: "no"
    depends_on:
      tix-db:
        condition: service_healthy
    env_file:
      - ontrak-tix/.env
    environment:
      TZ: ${TZ:-America/New_York}
      DATABASE_URL: postgresql://ontrak:ontrak@tix-db:5432/ontrak_tix

  # ── OnTrak Sentinel ───────────────────────────────────────────────────────
    volumes:
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - /etc/localtime:/etc/localtime:ro
  sentinel-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/New_York}
      POSTGRES_USER: ontrak
      POSTGRES_PASSWORD: ontrak
      POSTGRES_DB: sentinel
    ports:
      # As training-db: one mapping here, loopback included with the wildcard
      # default, and `docker-compose.lan-db.yml` for loopback plus a LAN address.
      - "${ONTRAK_SENTINEL_DB_BIND_HOST:-0.0.0.0}:${ONTRAK_SENTINEL_DB_PORT:-5434}:5432"
    volumes:
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - /etc/localtime:/etc/localtime:ro
      - ontrak-family-sentinel-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontrak -d sentinel"]
      interval: 5s
      timeout: 5s
      retries: 10

  sentinel-migrate:
    build:
      context: ontrak-sentinel
      target: builder
    command: npx prisma migrate deploy
    restart: "no"
    depends_on:
      sentinel-db:
        condition: service_healthy
    environment:
      TZ: ${TZ:-America/New_York}
      DATABASE_URL: postgresql://ontrak:ontrak@sentinel-db:5432/sentinel

  # Generates the signing key once and keeps it on a volume, so recreating the
  # provider does not stop it signing with the key it has already published.
    volumes:
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - /etc/localtime:/etc/localtime:ro
  sentinel-signing-key:
    build:
      context: ontrak-sentinel
      target: runner
    command: node --import tsx scripts/signing-key.ts
    restart: "no"
    environment:
      TZ: ${TZ:-America/New_York}
      SENTINEL_SIGNING_KEY_FILE: /run/sentinel/signing-key.pem
    volumes:
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - /etc/localtime:/etc/localtime:ro
      - ontrak-family-sentinel-keys:/run/sentinel

  sentinel-app:
    build:
      context: ontrak-sentinel
      target: runner
    restart: unless-stopped
    depends_on:
      sentinel-db:
        condition: service_healthy
      sentinel-migrate:
        condition: service_completed_successfully
      sentinel-signing-key:
        condition: service_completed_successfully
    ports:
      - "${ONTRAK_SENTINEL_BIND_HOST:-0.0.0.0}:${ONTRAK_SENTINEL_HTTP_PORT:-8787}:8787"
      # Guard's syslog listener (S3): the one port here that is not HTTP, and the
      # only one that is deliberately unauthenticated — syslog has no
      # authentication to offer, so the bind address is the access control. It is
      # published so a firewall or a kernel on another host can send to it; the
      # listener itself is off unless SENTINEL_GUARD_SYSLOG_PORT is set, and a
      # published UDP port with nothing behind it discards quietly, so a
      # deployment that is not listening should not map it (see docs).
      - "${SENTINEL_GUARD_BIND_HOST:-0.0.0.0}:${SENTINEL_GUARD_SYSLOG_PORT:-5514}:${SENTINEL_GUARD_SYSLOG_PORT:-5514}/udp"
      - "${SENTINEL_GUARD_BIND_HOST:-0.0.0.0}:${SENTINEL_GUARD_SYSLOG_PORT:-5514}:${SENTINEL_GUARD_SYSLOG_PORT:-5514}/tcp"
      # Guard's flow listener (S3): NetFlow/IPFIX on one UDP collector socket. Same
      # shape and same caveat as syslog above — off unless SENTINEL_GUARD_NETFLOW_PORT
      # is set, so a deployment that is not collecting flows should not map it.
      - "${SENTINEL_GUARD_BIND_HOST:-0.0.0.0}:${SENTINEL_GUARD_NETFLOW_PORT:-2055}:${SENTINEL_GUARD_NETFLOW_PORT:-2055}/udp"
    env_file:
      - path: ontrak-sentinel/.env
        required: false
    environment:
      TZ: ${TZ:-America/New_York}
      DATABASE_URL: postgresql://ontrak:ontrak@sentinel-db:5432/sentinel
      SENTINEL_HOST: 0.0.0.0
      SENTINEL_PORT: "8787"
      # The ingest token and the tenant are NOT set here: they come from
      # `ontrak-sentinel/.env` (the env_file above), so a `vault://` reference is
      # resolved by the image's entrypoint rather than shadowed by an empty
      # interpolation from the root .env. Only the switches are here.
      SENTINEL_GUARD_SYSLOG_PORT: ${SENTINEL_GUARD_SYSLOG_PORT:-}
      SENTINEL_GUARD_SYSLOG_HOST: ${SENTINEL_GUARD_SYSLOG_HOST:-127.0.0.1}
      SENTINEL_GUARD_SYSLOG_TRANSPORT: ${SENTINEL_GUARD_SYSLOG_TRANSPORT:-both}
      SENTINEL_GUARD_NETFLOW_PORT: ${SENTINEL_GUARD_NETFLOW_PORT:-}
      SENTINEL_GUARD_NETFLOW_HOST: ${SENTINEL_GUARD_NETFLOW_HOST:-127.0.0.1}
      SENTINEL_SIGNING_KEY_FILE: /run/sentinel/signing-key.pem
      NODE_ENV: production
      # The issuer, the WebAuthn origin and the seeded admin are **not** set
      # here: they come from `ontrak-sentinel/.env` (the env_file above).
      #
      # `environment:` beats `env_file:`, and this block is interpolated against
      # the *family* project's `.env` — the repo root's — which does not carry
      # them (`the standalone stack can pin a loopback default because its
      # project `.env` *is* `ontrak-sentinel/.env`; the family stack's is not).
      # Setting them here would therefore shadow the real values and make the
      # provider advertise `http://127.0.0.1:8787` as its issuer, so every ID
      # token it minted would name an origin no client can reach. Leave them to
      # the file; the image has a working default when the file is absent.
      # Register a public OIDC client for each product, so the family stack has two
      # client ids to hand out instead of one. Both are loopback by default, which
      # is the only plain-HTTP redirect URI the provider will register.
      SENTINEL_TIX_CALLBACK: ${SENTINEL_TIX_CALLBACK:-http://127.0.0.1:3001/api/sso/callback}
      SENTINEL_TRAINING_CALLBACK: ${SENTINEL_TRAINING_CALLBACK:-http://127.0.0.1:3000/api/sso/callback}
    volumes:
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - /etc/localtime:/etc/localtime:ro
      - ontrak-family-sentinel-keys:/run/sentinel:ro
      # This stack's Cerulean Vault token, narrowed to cerulean/data/ontrak. The
      # entrypoint reads it from VAULT_TOKEN_FILE (set in ontrak-sentinel/.env)
      # and resolves every `vault://` value before the provider boots, so a
      # secret can move out of `.env` without the application changing. Read-only,
      # and the platform's own token directory is the source — never the
      # mount-wide cerulean.token. The entrypoint starts as root (the token is
      # root-only) and drops to the `sentinel` user before serving.
      - ./data/vault/token/ontrak.token:/vault/token/ontrak.token:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/.well-known/openid-configuration').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── OnTrak Sync (CodeOps) ─────────────────────────────────────────────────
  # The Network's package and container update view, and the family's *local*
  # account table — the portal's password sign-in is delegated here, so this is
  # the product the other four consume rather than a fifth thing beside them.
  #
  # It keeps its own SQLite file (the history IS the database) and its own SSH key,
  # mounted read-only: the service may install packages through the key, it may not
  # rewrite the key that lets it do so.
  sync-api:
    build:
      context: ontrak-sync/backend
    # The dev/family stack follows the branch, so its images carry the moving
    # `main` tag and every build moves it. A moving tag cannot say which tree an
    # image came from, though — two builds of two commits are the same tag, which
    # is how a container ends up running an image older than the checkout it was
    # built from with nothing showing it. So every build also stamps the commit
    # alongside (`sha-<commit>`, the rule `scripts/publish-images.sh` and
    # `publish.yml` already use), and that is the one tag a later build cannot
    # overwrite. Set `ONTRAK_<PRODUCT>_IMAGE_TAG` to pin a specific build instead;
    # the deployment overlays already work this way.
    image: innotel/ontrak-sync-api:${ONTRAK_SYNC_API_IMAGE_TAG:-main}
    restart: unless-stopped
    env_file:
      - path: ontrak-sync/.env
        required: false
    environment:
      TZ: ${TZ:-America/New_York}
      ONTRAK_DB: /var/lib/ontrak/ontrak.sqlite3
      ONTRAK_BIND_HOST: 0.0.0.0
      ONTRAK_BIND_PORT: "8420"
      # REQUIRED, and deliberately not defaulted. A service that can install
      # packages on every machine in the Network must not come up answering
      # unauthenticated requests while somebody remembers to set it.
      ONTRAK_API_TOKEN: ${ONTRAK_API_TOKEN:-}
      # The browser reaches this deployment through the portal's own origin; the
      # redirect URI is registered against the public name and has to match.
      ONTRAK_PUBLIC_URL: ${ONTRAK_SYNC_PUBLIC_URL:-}
      ONTRAK_OIDC_ISSUER: ${ONTRAK_OIDC_ISSUER:-}
      ONTRAK_OIDC_CLIENT_ID: ${ONTRAK_SYNC_OIDC_CLIENT_ID:-}
      ONTRAK_OIDC_CLIENT_SECRET: ${ONTRAK_SYNC_OIDC_CLIENT_SECRET:-}
      ONTRAK_OIDC_ROLE_MAPPINGS: ${ONTRAK_OIDC_ROLE_MAPPINGS:-}
    volumes:
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - /etc/localtime:/etc/localtime:ro
      - ontrak-family-sync-data:/var/lib/ontrak
      - ${ONTRAK_SSH_KEY:-/root/.ssh/id_ed25519}:/root/.ssh/id_ed25519:ro
      - ${ONTRAK_SSH_KNOWN_HOSTS:-/root/.ssh/known_hosts}:/root/.ssh/known_hosts
      # This stack's Cerulean Vault token, narrowed to cerulean/data/ontrak — the same
      # read-only mount Sentinel, Genie and Tix take. The API keeps its session secret
      # and its registry credential as `vault://` values in `ontrak-sync/.env`, so
      # without this mount the entrypoint cannot resolve them and refuses to boot: a
      # service that started anyway would be holding the literal reference as a
      # credential, which looks configured and is not.
      - ./data/vault/token/ontrak.token:/vault/token/ontrak.token:ro
    ports:
      - "${ONTRAK_SYNC_BIND_HOST:-0.0.0.0}:${ONTRAK_SYNC_API_PORT:-8420}:8420"
    healthcheck:
      # Unauthenticated on purpose: /api/health is the one route that answers
      # without a credential, so a healthcheck never needs the secret in a file.
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8420/api/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  sync-web:
    build:
      context: ontrak-sync/web
      args:
        # EMPTY on purpose, unlike the product's own compose file: in the family
        # stack the dashboard is reached on one origin and forwards /api/* to the
        # API container itself. That is what makes the session cookie belong to one
        # hostname and the registered SSO redirect URI land on the browser's origin.
        NEXT_PUBLIC_ONTRAK_API: ""
    image: innotel/ontrak-sync-web:${ONTRAK_SYNC_WEB_IMAGE_TAG:-main}
    restart: unless-stopped
    depends_on:
      - sync-api
    environment:
      TZ: ${TZ:-America/New_York}
      ONTRAK_API_INTERNAL: http://sync-api:8420
      # The family's own name, printed under this product's name in the masthead —
      # the same variable the portal reads, so the two front doors cannot print
      # different domains.
      ONTRAK_PORTAL_BASE_DOMAIN: ${ONTRAK_PORTAL_BASE_DOMAIN:-ontrak.innotel.us}
    ports:
      - "${ONTRAK_SYNC_BIND_HOST:-0.0.0.0}:${ONTRAK_SYNC_WEB_PORT:-8421}:8421"
    healthcheck:
      test: ["CMD", "node", "-e",
             "fetch('http://127.0.0.1:8421/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── OnTrak Genie (CodeOps) ────────────────────────────────────────────────
  # The browser console for a coding agent: it reads, edits and runs code in a
  # workspace it cannot leave, and shows each call as it happens — including the
  # file being written, while it is still being written.
  #
  # No database. A workspace volume and a data volume holding sessions,
  # transcripts and per-file snapshots, which is what makes a restart lose
  # nothing and what lets the pane restore what it was showing.
  #
  # Two settings are required rather than defaulted, because both are the
  # difference between a console and an open shell:
  #   WEB_TOKEN      this console can read, write and run code, and publishing a
  #                  port is what makes it reachable. Empty is acceptable only on
  #                  loopback, which is why nothing is defaulted here.
  #   OMNIROUTE_URL  the stack's shared OmniRoute. Supplied by the deployment so
  #                  that no address of ours ends up in the repository.
    volumes:
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - /etc/localtime:/etc/localtime:ro
  genie-app:
    build:
      context: ontrak-genie
    image: innotel/ontrak-genie:${ONTRAK_GENIE_IMAGE_TAG:-main}
    restart: unless-stopped
    env_file:
      - path: ontrak-genie/.env
        required: false
    environment:
      TZ: ${TZ:-America/New_York}
      HOST: 0.0.0.0
      PORT: "3400"
      AGENT_WORKSPACE: /workspace
      AGENT_DATA_DIR: /data
      # This container is already the boundary, so run_command stays inside it
      # rather than trying to nest Docker — there is no socket here to nest into.
      AGENT_SANDBOX: host
      # The preview, published rather than only proxied.
      #
      # The pane always works — the console proxies the app — but that address is
      # a path on the console and nothing else on the network can use it. With
      # these set, the app the agent runs is reachable at the deployment's LAN
      # address, which is what a webhook, a phone, or a gateway calling back into
      # the app needs. `AGENT_LAN_IP` is the address this container is reachable
      # at from the network: inside a container every address the process can see
      # is a docker bridge address (`172.x`), so this is the one setting that
      # cannot be worked out from in here. It is the incus container's own LAN
      # address, which is the address that publishes this stack's ports.
      #
      # `${LAN_IP}` is the platform's own name for that address and is what
      # provisioning (`stack.sh lan`, which mirrors the same rule into
      # `scripts/stack-lib.sh`) writes into the deployment env. Accepting it here
      # means a deployment is wired up by the provisioner rather than by hand.
      AGENT_LAN_IP: ${AGENT_LAN_IP:-${LAN_IP:-}}
      AGENT_PREVIEW_HOST: ${AGENT_PREVIEW_HOST:-loopback}
      AGENT_PREVIEW_PORT: ${ONTRAK_GENIE_PREVIEW_PORT:-5173}
      AGENT_PREVIEW_PUBLISH: ${AGENT_PREVIEW_PUBLISH:-false}
      # Hosting, when it runs in its own container (`docker-compose.preview.yml`).
      # Set only in the deployment's root `.env`, deliberately *not* in
      # `ontrak-genie/.env`: that file is the preview host's env_file too, and a
      # hosting URL there would make the host a client of itself. These override
      # the env_file, so the console delegates even if the file says otherwise.
      GENIE_HOSTING_URL: ${GENIE_HOSTING_URL:-}
      GENIE_HOSTING_TOKEN: ${GENIE_HOSTING_TOKEN:-}
      # The sandbox's network, so the *other* half of "the app and its sandbox hold
      # the LAN address" is provided too: with the docker backend a command runs
      # with `--network host` and holds this deployment's own address, instead of
      # a bridge one nothing outside the host can dial. Unused when AGENT_SANDBOX
      # is `host` (the family default), where commands already have it.
      AGENT_SANDBOX_NETWORK: ${AGENT_SANDBOX_NETWORK:-none}
      OMNIROUTE_URL: ${OMNIROUTE_URL:-}
      WEB_TOKEN: ${WEB_TOKEN:-}
      # Tenancy, when the family has a control plane: with the origin and the
      # service token set, each turn spends the signed-in account's own gateway
      # key. Empty (the default) leaves Genie single-operator, spending
      # OMNIROUTE_API_KEY above.
      CONTROL_PLANE_INTERNAL_URL: ${CONTROL_PLANE_INTERNAL_URL:-}
      # The service token is NOT set here: it comes from `ontrak-genie/.env` (the
      # env_file above) as a Cerulean Vault `vault://` reference, resolved by the
      # image's entrypoint at startup. Interpolating it from this file's plaintext
      # would shadow that reference — the same trap the sign-in secrets below
      # avoid.
      # Sign-in, which tenancy needs: the plane keys accounts on the OIDC
      # subject, so tenancy without it refuses every turn. Off unless the issuer,
      # the client id and the session secret are all supplied. The redirect URI
      # has to be the address the *browser* reaches, matched byte for byte against
      # what is registered with the provider — the image's default is loopback,
      # which is right on a laptop and wrong for the family.
      #
      # The client secret and session secret are NOT set here: they come from
      # `ontrak-genie/.env` (the env_file above) as Cerulean Vault `vault://`
      # references, resolved by the image's entrypoint at startup. Putting them in
      # this block would interpolate the root `.env` plaintext and shadow the
      # references, which is exactly the credential this file is emptying out.
      ONTRAK_OIDC_ISSUER: ${ONTRAK_OIDC_ISSUER:-}
      ONTRAK_OIDC_CLIENT_ID: ${ONTRAK_OIDC_CLIENT_ID:-}
      ONTRAK_OIDC_REDIRECT_URL: ${ONTRAK_OIDC_REDIRECT_URL:-}
    volumes:
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - /etc/localtime:/etc/localtime:ro
      # The workspace is a *host directory* shared with the preview host
      # (`docker-compose.preview.yml`), because a preview is the project the agent
      # is editing: both containers have to see the same files at the same path,
      # and a docker named volume is private to one daemon. The incus device maps
      # the host's /srv/genie-workspace into this container; compose binds it to
      # /workspace. The console delegates the preview processes themselves (see
      # GENIE_HOSTING_URL in ontrak-genie/.env) rather than starting them here.
      - ${ONTRAK_GENIE_WORKSPACE:-/srv/genie-workspace}:/workspace
      - ontrak-family-genie-data:/data
      # This stack's Cerulean Vault token, narrowed to cerulean/data/ontrak. The
      # entrypoint reads it from VAULT_TOKEN_FILE (set in ontrak-genie/.env) and
      # resolves every `vault://` value before the server boots. Read-only, and
      # the platform's own token directory is the source — never the mount-wide
      # cerulean.token.
      - ./data/vault/token/ontrak.token:/vault/token/ontrak.token:ro
    # A remote folder is mounted with `sshfs`, and FUSE is a *device* rather than a
    # syscall. `AGENT_SANDBOX=host` above makes this container the one that runs
    # sshfs, so all three belong here rather than on a sandbox's `docker run`:
    # without the node every mount is answered "fuse: device /dev/fuse not found.
    # Kernel module not loaded?"; without SYS_ADMIN the mount is refused as EPERM
    # even when the node is there; and with both, Docker's own AppArmor profile
    # (`docker-default`) still denies the `mount` the `fusermount3` helper makes.
    # Each was measured on this deployment: any one of them missing is a failed
    # mount, and all three present is a working one.
    #
    # `apparmor=unconfined` is the honest shape of the third one — it is not a
    # capability scoped to FUSE but the profile taken off this container entirely.
    # That is defensible here and only here: this container *is* the boundary the
    # agent runs inside (`AGENT_SANDBOX=host`), it holds no other service's data,
    # and `no-new-privileges` still applies. Narrow it with a host AppArmor profile
    # that allows `mount` for `fuse` alone and name that profile instead if the
    # host is shared with anything that cares.
    devices:
      - /dev/fuse:/dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor=unconfined
    ports:
      - "${ONTRAK_GENIE_BIND_HOST:-0.0.0.0}:${ONTRAK_GENIE_PORT:-3400}:3400"
      # The preview. One published port, because the app is one app: a second
      # project previewed at the same time lands on a free port of its own, is
      # still visible in the pane, and is honestly reported as *not* on the
      # network rather than given an address nothing forwards.
      - "${ONTRAK_GENIE_BIND_HOST:-0.0.0.0}:${ONTRAK_GENIE_PREVIEW_PORT:-5173}:${ONTRAK_GENIE_PREVIEW_PORT:-5173}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3400/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── OnTrak Portal (the front door) ────────────────────────────────────────
  # One sign-in, then the products a role belongs in. It holds no data of its own
  # — no database, no migrations, no user table — which is why it can be restarted
  # at any moment and why a role change in Cerulean takes effect everywhere at once
  # instead of in five places.
  portal-app:
    build:
      context: ontrak-portal
    image: innotel/ontrak-portal:${ONTRAK_PORTAL_IMAGE_TAG:-main}
    restart: unless-stopped
    depends_on:
      - sync-api
    env_file:
      - path: ontrak-portal/.env
        required: false
    environment:
      TZ: ${TZ:-America/New_York}
      ONTRAK_PORTAL_BASE_DOMAIN: ${ONTRAK_PORTAL_BASE_DOMAIN:-ontrak.innotel.us}
      ONTRAK_PORTAL_PUBLIC_URL: ${ONTRAK_PORTAL_PUBLIC_URL:-http://127.0.0.1:3300}
      # REQUIRED. There is no default: a session cookie signed with a placeholder
      # is a session cookie anybody can mint.
      ONTRAK_PORTAL_SESSION_SECRET: ${ONTRAK_PORTAL_SESSION_SECRET:-}
      ONTRAK_OIDC_ISSUER: ${ONTRAK_OIDC_ISSUER:-}
      ONTRAK_OIDC_CLIENT_ID: ${ONTRAK_PORTAL_OIDC_CLIENT_ID:-}
      ONTRAK_OIDC_CLIENT_SECRET: ${ONTRAK_PORTAL_OIDC_CLIENT_SECRET:-}
      ONTRAK_OIDC_ROLE_MAPPINGS: ${ONTRAK_OIDC_ROLE_MAPPINGS:-}
      ONTRAK_OIDC_PROVIDER_NAME: ${ONTRAK_OIDC_PROVIDER_NAME:-Cerulean}
      # The local account table, over the compose network — not the published port.
      ONTRAK_SYNC_API_URL: http://sync-api:8420
      # Probes for the tiles' status lights. Server-side, so they use the network
      # names; the *links* still print the public addresses. Each one is the address
      # of the *product* — the origin a browser would open — because that is what the
      # portal asks for liveness and each product answers `/health` there.
      #
      # Sync is the product that makes the distinction matter, because it is the one
      # the stack runs as two services: `/health` is the dashboard's, so the probe has
      # to go to `sync-web:8421`. Pointed at the API instead, it asks
      # `sync-api:8420/health`, which serves only `/api/...` and answers 404 — a
      # healthy Sync drawn as an outage on the page whose whole job is the opposite.
      # The API keeps its own address above, in `ONTRAK_SYNC_API_URL`, where the
      # account table is read.
      ONTRAK_ITS_INTERNAL_URL: http://training-app:3000
      ONTRAK_TIX_INTERNAL_URL: http://tix-app:3000
      ONTRAK_SENTINEL_INTERNAL_URL: http://sentinel-app:8787
      ONTRAK_SYNC_INTERNAL_URL: http://sync-web:8421
      ONTRAK_GENIE_INTERNAL_URL: http://genie-app:3400
      # The two Genie add-ons are behind their own oauth2-proxy, so `/health` is not
      # reachable from the public name — an unauthenticated request is redirected to
      # the sign-in page and answered by that, not by the product. Ask the containers.
      ONTRAK_ENGINEER_INTERNAL_URL: http://engineer-portal:8080
      ONTRAK_GODMODE_INTERNAL_URL: http://g0dm0d3:8080
      # OnTrak Lab is a peer deployment this stack does not run, so it is off unless a
      # deployment has one to point at. The portal draws no lab tile at all until both
      # are set, which is what keeps a stack with no lab from opening on a red light
      # for a product nobody is running.
      ONTRAK_LAB_ENABLED: ${ONTRAK_LAB_ENABLED:-}
      ONTRAK_LAB_URL: ${ONTRAK_LAB_URL:-}
      ONTRAK_LAB_INTERNAL_URL: ${ONTRAK_LAB_INTERNAL_URL:-}
    ports:
      - "${ONTRAK_PORTAL_BIND_HOST:-0.0.0.0}:${ONTRAK_PORTAL_PORT:-3300}:3300"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3300/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

    volumes:
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - /etc/localtime:/etc/localtime:ro
      # The same read-only Vault token as the rest of the family: the portal's own
      # `vault://` values (in `ontrak-portal/.env`) are resolved by its entrypoint
      # before it serves, and an unresolved reference stops it from booting rather
      # than letting it come up holding the reference as a secret.
      - ./data/vault/token/ontrak.token:/vault/token/ontrak.token:ro

  # G0DM0D3 — the metered front door to Genie.
  #
  # It holds no model key and no ledger: a run is charged in the control plane and
  # performed by Genie, and this container is the short path between the two. That
  # is also why it has no volume — nothing here is worth keeping, and a restart
  # must not lose a balance (the plane holds it).
  #
  # Not published. The only way in is the SSO proxy in front of it (see
  # `g0dm0d3-sso`), which is what makes the identity header trustworthy; publishing
  # this port would let anyone on the LAN claim to be anybody by setting a header.
  # OnTrak Engineer's own portal — the same program as G0DM0D3, for the other
  # product.
  #
  # One image, two instances: both ask the control plane whether the account is
  # subscribed and how many credits are left, and differ only in what they are
  # called, which ledger line they spend, and which of Genie's products they lead
  # to. Keeping them one program is what stops the two front doors from answering
  # the subscription question differently.
  engineer-portal:
    build:
      context: g0dm0d3
    image: innotel/g0dm0d3:${G0DM0D3_IMAGE_TAG:-main}
    restart: unless-stopped
    env_file:
      - path: g0dm0d3/.env
        required: false
    environment:
      TZ: ${TZ:-America/New_York}
      PORT: "8080"
      GENIE_URL: http://genie-app:3400
      WEB_TOKEN: ${WEB_TOKEN:-}
      G0DM0D3_TRUST_PROXY_HEADERS: ${G0DM0D3_TRUST_PROXY_HEADERS:-0}
      # `engineer` is the plan Magnate sells and the product key the credit ledger
      # is written under, so the two cannot drift apart.
      PRODUCT_SLUG: engineer
      G0DM0D3_PRODUCT: engineer
      PRODUCT_NAME: OnTrak Engineer
      PRODUCT_TAGLINE: reverse engineer a shipped application, with the evidence
      # The family page, not OnTrak's own: Engineer is sold as Genie credits, and
      # `subscribe.genie.innotel.us` is the page that lists the Engineer plan
      # ($5 a credit) beside the subdomain. Pointed at `subscribe.ontrak...` the
      # "Add more credits" button landed on a page that has no Engineer plan on it
      # at all — the offer was one redirect away from the person who needed it.
      SUBSCRIBE_URL: https://subscribe.genie.innotel.us
      # The console is `genie.innotel.us`; `genie.ontrak.innotel.us` was a second
      # name for the same thing and has been retired. A link that 404s is worse
      # than no link, especially from the page whose whole job is to hand somebody
      # the agent.
      WORK_URL: https://genie.innotel.us
    depends_on:
      - genie-app
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Engineer's sign-in, the same shape as G0DM0D3's: the family's `ontrak` client,
  # the same group gate, server-side sessions. Published on the LAN address the
  # edge forwards `re.genie.innotel.us` to.
  engineer-portal-sso:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.2
    restart: unless-stopped
    env_file:
      - path: engineer-portal-sso/.env
        required: false
    environment:
      TZ: ${TZ:-America/New_York}
    ports:
      - "${ENGINEER_PORTAL_SSO_BIND:-192.168.1.21}:8095:4180"
    depends_on:
      - engineer-portal
      - g0dm0d3-sso-sessions
    command:
      - --provider=oidc
      - --oidc-issuer-url=https://auth.cerulean.innotel.us/application/o/ontrak/
      - --oidc-groups-claim=groups
      - "--scope=openid email profile groups"
      - --email-domain=*
      - --insecure-oidc-allow-unverified-email
      - --allowed-group=ontrak-sysadmins
      - --allowed-group=ontrak-admins
      - --skip-provider-button=true
      - --cookie-secure=true
      - --cookie-samesite=lax
      - --whitelist-domain=.innotel.us
      - --reverse-proxy=true
      - --set-xauthrequest=true
      - --pass-user-headers=true
      - --upstream=http://engineer-portal:8080
      - --http-address=0.0.0.0:4180
      - --redirect-url=https://re.genie.innotel.us/oauth2/callback
      - --session-store-type=redis
      - --redis-connection-url=redis://g0dm0d3-sso-sessions:6379/1
      - --silence-ping-logging=true

  # G0DM0D3's sign-in.
  #
  # The family's products sign in themselves; this one cannot, because it is not a
  # product — it is a page in front of Genie. So the sign-in is a proxy: oauth2-proxy
  # authenticates the person against the same `ontrak` OIDC client the console and
  # the portal use, and passes the address on in `x-forwarded-email`
  # (`--pass-user-headers`). `--set-xauthrequest` is not the one that reaches this
  # app: it fills *response* headers, which is what nginx's auth_request mode
  # reads. The app accepts either, but the forwarded one is what it gets here. That header
  # is why the app behind it trusts it: this container is the only way in.
  #
  # Gated by group, not by "has an account": G0DM0D3 runs an agent that reads and
  # runs code, which is what `ontrak-sysadmins` and `ontrak-admins` are for.
  # G0DM0D3's SSO sessions, server-side.
  #
  # Not a cache: this is where oauth2-proxy keeps the session so the browser only
  # has to carry a small ticket. No volume, because a session that outlives a
  # restart is a session nobody can revoke, and signing in again costs one redirect.
  g0dm0d3-sso-sessions:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  g0dm0d3-sso:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.2
    restart: unless-stopped
    env_file:
      - path: g0dm0d3-sso/.env
        required: false
    environment:
      TZ: ${TZ:-America/New_York}
    ports:
      # Published on the LAN address the edge forwards to, and nowhere else.
      - "${G0DM0D3_SSO_BIND:-192.168.1.21}:8094:4180"
    depends_on:
      - g0dm0d3
      - g0dm0d3-sso-sessions
    command:
      - --provider=oidc
      - --oidc-issuer-url=https://auth.cerulean.innotel.us/application/o/ontrak/
      - --oidc-groups-claim=groups
      - "--scope=openid email profile groups"
      - --email-domain=*
      - --insecure-oidc-allow-unverified-email
      - --allowed-group=ontrak-sysadmins
      - --allowed-group=ontrak-admins
      - --skip-provider-button=true
      - --cookie-secure=true
      - --cookie-samesite=lax
      - --whitelist-domain=.innotel.us
      - --reverse-proxy=true
      - --set-xauthrequest=true
      - --pass-user-headers=true
      - --upstream=http://g0dm0d3:8080
      - --http-address=0.0.0.0:4180
      - --redirect-url=https://uc.genie.innotel.us/oauth2/callback
      - --session-store-type=redis
      - --redis-connection-url=redis://g0dm0d3-sso-sessions:6379/0
      - --silence-ping-logging=true

  g0dm0d3:
    build:
      context: g0dm0d3
    image: innotel/g0dm0d3:${G0DM0D3_IMAGE_TAG:-main}
    restart: unless-stopped
    env_file:
      - path: g0dm0d3/.env
        required: false
    environment:
      TZ: ${TZ:-America/New_York}
      PORT: "8080"
      # The agent that does the work, on this compose network.
      GENIE_URL: http://genie-app:3400
      # Genie's shared bearer: the service credential this app calls it with. It is
      # the same value the console accepts, so it is long and random and never
      # leaves the deployment's env.
      WEB_TOKEN: ${WEB_TOKEN:-}
      G0DM0D3_TRUST_PROXY_HEADERS: ${G0DM0D3_TRUST_PROXY_HEADERS:-0}
      # The family's OmniRoute, for the studio's own completions.
      #
      # Only the address lives here: the key a completion spends is the signed-in
      # person's own, issued by the control plane below from their OIDC subject, and
      # the studio never sees it (the browser calls `/api/gateway/v1/…` on this
      # origin). Empty keeps the old behaviour — the page asks each visitor for a
      # personal OpenRouter key — which is what a deployment without a gateway
      # should do.
      OMNIROUTE_URL: ${OMNIROUTE_URL:-}
      OMNIROUTE_MODEL: ${G0DM0D3_GATEWAY_MODEL:-auto/chat}
      # The name the family's dashboard gives this product, and the plan Magnate sells
      # under it, so the tile and the page it opens cannot disagree — nor can the page
      # and the ledger row. `g0dm0d3` stays the ledger key it has always been.
      # The product's own name, not the repository's: the ledger key stays
      # `g0dm0d3` (a rename there would orphan every charge already recorded),
      # and what a person sees is the word on the page.
      PRODUCT_NAME: UNCENSORED
      PRODUCT_TAGLINE: the agent with the guardrails off, one credit a run
      SUBSCRIBE_URL: https://subscribe.genie.innotel.us
      # The console is `genie.innotel.us`; `genie.ontrak.innotel.us` was a second
      # name for the same thing and has been retired. A link that 404s is worse
      # than no link, especially from the page whose whole job is to hand somebody
      # the agent.
      WORK_URL: https://genie.innotel.us
    depends_on:
      - genie-app
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  ontrak-family-guac-recordings:
  ontrak-family-training-db:
  ontrak-family-training-storage:
  ontrak-family-tix-db:
  ontrak-family-tix-blobs:
  ontrak-family-tix-evidence:
  ontrak-family-sentinel-db:
  ontrak-family-sentinel-keys:
  ontrak-family-sync-data:
  ontrak-family-genie-data:
