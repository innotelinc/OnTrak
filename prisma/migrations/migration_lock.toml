# Please do not edit this file manually
# It should be added in your version-control system (e.g., Git)
#
# The migrations directory shipped without this file, which is why
# `prisma migrate diff --from-migrations` could not tell which connector the history
# was built for. `prisma migrate dev` writes it on first use; committing it is what
# makes the history replayable by a tool rather than only by a database that already
# has the tables.
provider = "postgresql"
