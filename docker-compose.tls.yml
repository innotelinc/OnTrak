# ============================================================================
# OnTrak — the TLS overlay: the same stack, encrypted, on one published port.
#
#   make up        (the default — `make tls` is an alias)
#   # or: docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
#
# This is for a range reached directly on a LAN — a laptop, a mini-PC, a phone
# hotspot — where the traffic crosses a network you do not own. The base stack
# publishes plain HTTP on 8080 for the host that already sits behind a TLS edge;
# this file terminates TLS *in the gateway itself* and publishes 8443 instead, so
# there is no unencrypted port left open beside it. `make up` names it, because
# leaving TLS to a separate command left the clear-text posture one word away.
#
# What it changes, and nothing else:
#
#   * the gateway is the only service with a published port, and it is 8443 (TLS).
#     The base stack's 8080 mapping is replaced, not added to: `!override` on
#     `ports` drops the plain listener, so a student cannot reach the range in the
#     clear even by habit.
#   * the gateway mounts `nginx.tls.conf` in place of `nginx.conf`, so its only
#     `server` block is the TLS one. Both configs include the same
#     `ontrak-upstreams.inc`, so the routing is byte-for-byte the same.
#   * the certificate and key come from `./deploy/tls`, which is gitignored and
#     created by `scripts/tls-local-cert.sh` (`make up` runs it if it is missing).
#
# The rest of the stack — portal, console, lab-setup, the host step — is untouched.
# To go back to plain HTTP, start without this file.
# ============================================================================

services:
  gateway:
    ports: !override
      # One published port again: TLS only. Point the browser at
      # https://<this host>:8443/ — and the console is /guacamole/ on the same one.
      - "${ONTRAK_BIND_ADDR:-0.0.0.0}:${ONTRAK_TLS_PORT:-8443}:8443"
    volumes: !override
      - ./deploy/gateway/nginx.tls.conf:/etc/nginx/conf.d/default.conf:ro
      # The routing both listeners share. Same absolute target as the base stack.
      - ./deploy/gateway/ontrak-upstreams.inc:/etc/nginx/conf.d/ontrak-upstreams.inc:ro
      # The local certificate pair. Gitignored; generated by `make tls`.
      - ./deploy/tls:/etc/nginx/tls:ro
