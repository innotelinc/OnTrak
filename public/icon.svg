<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="OnTrak IT Support Training">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c5cf5" />
      <stop offset="100%" stop-color="#4b2fc9" />
    </linearGradient>
  </defs>
  <!-- The family's mark, at the size a home screen needs it: the shield every
       OnTrak product carries, with the range's own tick inside. Drawn as an outline
       rather than a filled shield so the two shapes stay legible at 32px. -->
  <rect width="512" height="512" rx="112" fill="url(#brand)" />
  <g
    transform="translate(64 60) scale(8)"
    fill="none"
    stroke="#ffffff"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M24 4.5 L41 12 V27 C41 37.4 34 43 24 44.5 C14 43 7 37.4 7 27 V12 Z" />
    <path d="M16 25 l4.5 4.5 L32.5 20.5" />
  </g>
</svg>
