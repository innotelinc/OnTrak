[project]
name = "ontrak"
version = "0.1.0"
description = "Automated Windows tech-support training range on Ubuntu + Incus"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "cryptography>=42.0",
    "pywinrm>=0.4.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
ontrak = "ontrak.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ontrak", "ontrak.portal"]

[tool.setuptools.package-data]
"ontrak.portal" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
ignore = [
    # FastAPI takes its dependencies as call-in-default-argument; that is the
    # framework's idiom, not a bug.
    "B008",
]
