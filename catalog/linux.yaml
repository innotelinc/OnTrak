# Linux distributions.
#
# This hand-written group is the curated, offline-safe set. `ontrak catalog refresh`
# additionally regenerates `catalog/linux-images.yaml` from everything the configured
# Incus image server publishes, which is how "all Linux distributions" stays true
# as the server's catalog grows.
#
# Containers start in about a second, so they are the default here. Entries that need
# a kernel (boot loaders, drivers, kernel modules, systemd-boot) are VMs instead.
group: linux
label: Linux
era: 1991-present
description: >
  Server and desktop Linux. Container entries come straight from the image server
  and are the fastest thing OnTrak can hand a student; VM entries are for exercises
  that touch boot, kernel or driver behaviour.
family: linux
defaults:
  kind: container
  family: linux
  install: {recipe: container-image}
  media: {source: free, kind: image}
  automation: ssh
  device_profile: linux-container
  # Identity/access scenarios (account locks, group membership, session revocation)
  # run against the simulated directory service that the scenario ships, so any Linux
  # guest can host them — which is why identity is in the family list here rather
  # than being tied to one special image.
  scenario_families: [network, software, os, security, identity]

entries:
  # -- Ubuntu ------------------------------------------------------------
  - id: ubuntu-24.04
    name: Ubuntu 24.04 LTS
    released: "2024-04"
    support: supported
    install: {recipe: container-image, alias: images:ubuntu/24.04}
    media: {source: free, kind: image, filename: images:ubuntu/24.04}
    tags: [lts, common, debian-family]
    notes: Current LTS; the default Linux student platform.
  - id: ubuntu-22.04
    name: Ubuntu 22.04 LTS
    released: "2022-04"
    support: supported
    install: {recipe: container-image, alias: images:ubuntu/22.04}
    media: {source: free, kind: image, filename: images:ubuntu/22.04}
    tags: [lts, common, debian-family]
    notes: Still the most common production Ubuntu in the field.
  - id: ubuntu-20.04
    name: Ubuntu 20.04 LTS
    released: "2020-04"
    support: extended
    install: {recipe: container-image, alias: images:ubuntu/20.04}
    media: {source: free, kind: image, filename: images:ubuntu/20.04}
    tags: [lts, debian-family]
    notes: Standard support ended; a realistic "stuck on an old release" platform.
  - id: ubuntu-18.04
    name: Ubuntu 18.04 LTS
    released: "2018-04"
    support: eol
    install: {recipe: container-image, alias: images:ubuntu/18.04}
    media: {source: free, kind: image, filename: images:ubuntu/18.04}
    tags: [lts, legacy, debian-family]
    notes: End-of-life; apt endpoints are archived, which is itself a useful exercise.
  - id: ubuntu-16.04
    name: Ubuntu 16.04 LTS
    released: "2016-04"
