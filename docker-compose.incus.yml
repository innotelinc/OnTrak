# Overlay for a portal that talks to the **host's own** Incus daemon.
#
#   docker compose -f docker-compose.yml -f docker-compose.incus.yml up -d
#
# `make up` applies this overlay automatically when the host has a live socket,
# which is the normal single-host lab: Incus and Docker on the same machine,
# Docker only for the control plane and the console gateway.
#
# Not needed when the portal drives a remote Incus cluster over HTTPS (mount the
# CLI's trust config instead — see docs/docker.md § "A remote Incus cluster"),
# and not needed for demo mode, which has no hypervisor at all.

services:
  portal:
    volumes:
      # The whole Incus API in one file. The portal shells out to the `incus`
      # CLI, and `incus.remote: local` is that socket. This is why the container
      # is privileged: an unprivileged reader of this socket can create, delete
      # and exec into machines. Treat the portal container as a hypervisor
      # admin, because that is what it is.
      - /var/lib/incus/unix.socket:/var/lib/incus/unix.socket
