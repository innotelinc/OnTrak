# ═══════════════════════════════════════════════════════════════════════════
# OnTrak Sentinel — the identity provider and its database.
#
#   cd ontrak-sentinel
#   docker compose up -d          build the image, migrate, serve on :8787
#
# Unlike the other two stacks this one needs no `.env` to start: every value it
# reads has a working default, and the signing key is generated onto a volume on
# the first `up` and reused after that. `.env` is read when it exists (copy it from
# `.env.example`) and is the place to set the issuer, the signing key and the
# seeded administrator.
#
# Sentinel keeps its own database — it issues identity for the training app and
# for OnTrak Tix but shares no tables with them, so one product's compromise is
# not another's evidence. It is published on 5434 rather than the 5432 the other
# two use, so all three stacks can run at once; override it with
# ONTRAK_SENTINEL_DB_PORT if that is taken too.
# ═══════════════════════════════════════════════════════════════════════════

name: ontrak-sentinel

services:
  db:
    image: postgres:16-alpine
    # No `container_name`: that fixes the name for every project, which stops
    # the production overlay running under its own `-p` alongside this one
    # (compose names containers `<project>-<service>-<n>` by default).
    restart: unless-stopped
    environment:
      POSTGRES_USER: ontrak
      POSTGRES_PASSWORD: ontrak
      POSTGRES_DB: sentinel
    ports:
      - "${ONTRAK_SENTINEL_DB_PORT:-5434}:5432"
    volumes:
      - ontrak-sentinel-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontrak -d sentinel"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies the tracked migrations, then exits. Runs in the builder stage, which
  # is the one that carries the Prisma CLI and the `prisma/migrations/` tree.
  # Sentinel has real migrations rather than a pushed schema, because the
  # evidence chain is append-only and a deployment must be able to say which
  # order its schema arrived in.
  migrate:
    build:
      context: .
      target: builder
    command: npx prisma migrate deploy
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Inside the network the database is the `db` service. Never 127.0.0.1:
      # in a container that address is the container itself.
      DATABASE_URL: postgresql://ontrak:ontrak@db:5432/sentinel

  # Generates the signing key once and keeps it on a volume, so recreating this
  # container does not stop the provider signing with the key it has already
  # published. Idempotent: every run after the first reuses what is there.
  signing-key:
    build:
      context: .
      target: runner
    command: node --import tsx scripts/signing-key.ts
    restart: "no"
    environment:
      SENTINEL_SIGNING_KEY_FILE: /run/sentinel/signing-key.pem
    volumes:
      - ontrak-sentinel-keys:/run/sentinel

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      signing-key:
        condition: service_completed_successfully
    ports:
      - "${ONTRAK_SENTINEL_HTTP_PORT:-8787}:8787"
      # Guard's syslog listener (S3): the one port here that is not HTTP, and the
      # only one that is deliberately unauthenticated — syslog has no
      # authentication to offer, so the bind address is the access control. It is
      # published so a firewall or a kernel on another host can send to it; the
      # listener itself is off unless SENTINEL_GUARD_SYSLOG_PORT is set, and a
      # published UDP port with nothing behind it discards quietly. This mirrors
      # the mapping `docker-compose.all.yml` gives the family stack, so both
      # deployments listen the same way (see docs/guard-syslog.md).
      - "${SENTINEL_GUARD_SYSLOG_PORT:-5514}:${SENTINEL_GUARD_SYSLOG_PORT:-5514}/udp"
      - "${SENTINEL_GUARD_SYSLOG_PORT:-5514}:${SENTINEL_GUARD_SYSLOG_PORT:-5514}/tcp"
      # The flow listener (S3), the same shape as syslog above: NetFlow v5/v9 and
      # IPFIX (v10) on one UDP collector socket, published so a firewall or router
      # on another host can export to it. Off unless SENTINEL_GUARD_NETFLOW_PORT is
      # set, and a published UDP port with nothing behind it discards quietly.
      - "${SENTINEL_GUARD_NETFLOW_PORT:-2055}:${SENTINEL_GUARD_NETFLOW_PORT:-2055}/udp"
    # Optional, and the only stack here that can say so: Sentinel boots with
    # nothing configured, so a first `up` works before anyone has copied the
    # example across. Values set in `.env` still override the defaults below.
    env_file:
      - path: .env
        required: false
    environment:
      # Overrides the host-oriented DATABASE_URL in `.env`, which points at
      # 127.0.0.1 and would name this container itself from in here.
      DATABASE_URL: postgresql://ontrak:ontrak@db:5432/sentinel
      SENTINEL_HOST: 0.0.0.0
      SENTINEL_PORT: "8787"
      # What every advertised endpoint and every ID token's `iss` is prefixed
      # with, so it must be the address a *client* reaches, not the container's.
      # Set it in `.env` to this machine's address or to the name a reverse
      # proxy serves; the loopback default is only right for a local client.
      SENTINEL_ISSUER: ${SENTINEL_ISSUER:-http://127.0.0.1:8787}
      SENTINEL_ADMIN_EMAIL: ${SENTINEL_ADMIN_EMAIL:-admin@demo.test}
      # The syslog listener's switches. The token and the tenant it files under
      # are **not** set here: they come from `.env` (the env_file above), so a
      # `vault://` reference is resolved by the entrypoint rather than shadowed by
      # an empty interpolation. Only the port, the bind and the transport are
      # here, because those are deployment facts rather than credentials.
      SENTINEL_GUARD_SYSLOG_PORT: ${SENTINEL_GUARD_SYSLOG_PORT:-}
      SENTINEL_GUARD_SYSLOG_HOST: ${SENTINEL_GUARD_SYSLOG_HOST:-127.0.0.1}
      SENTINEL_GUARD_SYSLOG_TRANSPORT: ${SENTINEL_GUARD_SYSLOG_TRANSPORT:-both}
      SENTINEL_GUARD_NETFLOW_PORT: ${SENTINEL_GUARD_NETFLOW_PORT:-}
      SENTINEL_GUARD_NETFLOW_HOST: ${SENTINEL_GUARD_NETFLOW_HOST:-127.0.0.1}
      # The key the one-shot service just ensured. `SENTINEL_SIGNING_KEY` takes
      # precedence over this, which is how a deployment that resolves its secrets
      # before the process starts overrides the volume.
      SENTINEL_SIGNING_KEY_FILE: /run/sentinel/signing-key.pem
      NODE_ENV: production
    # Read-only: the provider only ever reads the key, and the one-shot service is
    # the only thing that should be able to write it.
    volumes:
      - ontrak-sentinel-keys:/run/sentinel:ro
    # "Healthy" here means the provider is answering, not that its database is
    # reachable: a database blip should not mark a running provider unhealthy and
    # send an operator after the wrong container. Discovery is served from
    # configuration alone, which makes it a clean probe for exactly that.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  ontrak-sentinel-db:
  # The signing key. Separate from the database on purpose: losing the database is
  # a restore, but losing the key silently invalidates every token in the wild.
  ontrak-sentinel-keys:
