# OnTrak's origin, with TLS: the same routing as `nginx.conf`, served over HTTPS.
#
#   make up       # the default: certificate if needed, then start with this file
#   # or: docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
#
# This is what a range reached directly on a LAN uses. Terminating here rather than
# in a second container in front of the gateway keeps it to one proxy hop: `$scheme`
# in this server block *is* https, so the portal adds `X-Forwarded-Proto` itself and
# the console link comes back https without anything upstream having to say so. The
# port survives because the shared include proxies `$http_host` (see
# `ontrak-upstreams.inc`), which is what makes `https://<host>:8443/guacamole/`
# resolve to the right address on a phone.
#
# The certificate is self-signed and local: see `scripts/tls-local-cert.sh`. A
# browser that has never seen it will warn once — the traffic is encrypted either
# way, and the warning goes away when the certificate is trusted on the device (or
# when a real certificate replaces it, e.g. from Cerulean's edge).
#
# `docker-compose.tls.yml` mounts this file as the gateway's `default.conf` and
# publishes 8443 alone, so the plain listener in `nginx.conf` is not part of that
# stack at all — no unencrypted port is left open beside it.

# Duplicated from `nginx.conf` because `map` is not allowed inside a `server`
# block and this file replaces that one rather than extending it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_host $forwarded_host {
    default $http_host;
    ''      $host;
}

server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/tls/ontrak.crt;
    ssl_certificate_key /etc/nginx/tls/ontrak.key;
    # 1.0 and 1.1 are refused by every current browser and by this stack's own
    # `X-Forwarded-Proto` expectations; 1.2 is the floor, 1.3 is what a phone uses.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ontrak_tls:10m;
    ssl_session_timeout 1h;

    include /etc/nginx/conf.d/ontrak-upstreams.inc;
}
