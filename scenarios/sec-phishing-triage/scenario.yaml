id: sec-phishing-triage
title: Suspicious invoice email — triage before it spreads
category: security
difficulty: 3
minutes: 30
pass_score: 80
tags: [phishing, triage, email, hosts-file, process]
requires_internet: false
briefing: >
  A user forwarded an email that claims to be an overdue invoice. They have not
  opened the attachment, but they did try to "fix" a broken intranet page earlier
  by editing a system file on this machine.

  Triage the email and the machine: say what the indicators are, isolate anything
  that could execute, and leave the machine's configuration the way you found it.
  Write your findings where the ticket expects them — an incident that is not
  written down did not happen.

  Nothing on this machine is real malware: the attachment is a placeholder and the
  network is isolated.
ticket:
  reported_by: User
  channel: Service desk
  priority: High
  summary: Phishing report — invoice attachment
  notes:
    - "The user is waiting on your conclusion: was this a real attack?"
    - "Documentation is part of the triage, not an optional extra."
  form:
    title: Incident write-up — phishing triage
    intro: >
      The user wants an answer and the security team wants a record. One write-up
      covers both, and it is marked.
    weight: 30
    fields:
      - id: symptom
        label: What the user reported, in your own words
        kind: textarea
        weight: 15
        min_words: 8
        placeholder: "What they clicked or did not click, and when."
      - id: root_cause
        label: Why this is malicious (or why it is not)
        kind: textarea
        weight: 30
        min_words: 6
        any_of: [spoof, lookalike, look-alike, domain, attachment, sender, phishing, header]
        none_of: ["it was probably fine", "the user was at fault", "nothing to do"]
        hint: "Point at the evidence: sender address, link target, attachment behaviour."
      - id: category
        label: Classification
        kind: select
        weight: 15
        options:
          - Phishing
          - Malware
          - Spam
          - Legitimate mail
        expected: Phishing
      - id: action
        label: What you did about it
        kind: textarea
        weight: 25
        min_words: 8
        any_of: [isolated, quarantined, blocked, deleted, removed, reported, escalated]
        hint: "Isolating the attachment and reporting it are separate actions."
      - id: verification
        label: How you confirmed the result
        kind: textarea
        weight: 15
        min_words: 6
        any_of: [header, sender, URL, hash, sandbox, blocked, report, evidence]
        hint: "What you checked after acting — a claim with no check is a guess."
objectives:
  - id: phish-indicators
    text: The indicators are written up (spoofed sender, lookalike domain, attachment)
    weight: 30
    critical: true
  - id: attachment-isolated
    text: The downloaded attachment has been isolated so it cannot be run
    weight: 30
    critical: true
  - id: hosts-restored
    text: The hosts file is back to the vendor default
    weight: 20
  - id: phish-reported
    text: The incident report records the sender, the URL and the action taken
    weight: 20
hints:
  - "Read the message headers the way a mail server would, not the way a user does."
  - "An attachment that is still sitting in a user's Downloads folder is one double-click from executing."
  - "The user changed a file that maps names to addresses. Windows keeps it in a well-known place."
  - "A triage report needs the indicators, the evidence and the action taken — in that order."
reset_notes: Reset destroys the machine and clones a fresh copy, so the email and the hosts edit come back.
